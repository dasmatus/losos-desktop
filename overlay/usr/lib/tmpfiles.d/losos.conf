# Directories the OS needs that a tmpfs /etc and a fresh /var will not have.
#
# The root filesystem is created by systemd-repart on first boot and is empty
# apart from what the rootfs tarball put there, so anything expecting a
# directory to pre-exist has to say so here.
d /var/lib/gdm       0711 gdm  gdm  -
d /var/lib/systemd/home 0700 root root -
d /var/log/journal   2755 root systemd-journal -
d /var/lib/portables 0700 root root -
d /var/lib/machines  0700 root root -
d /var/lib/extensions 0755 root root -
d /var/lib/confexts  0755 root root -
