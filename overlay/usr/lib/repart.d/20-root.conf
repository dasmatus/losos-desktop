# The root partition.
#
# Type=root-x86-64 is not cosmetic: systemd-gpt-auto-generator finds the root
# filesystem by GPT type UUID, which is why this OS needs no /etc/fstab and no
# root= on the kernel command line.
[Partition]
Type=root-x86-64
Format=ext4
# Grows to fill whatever disk it lands on, leaving room for /home below.
SizeMinBytes=8G
PaddingMinBytes=0
