# The EFI system partition.
#
# systemd-repart creates this on first boot if it is absent. That is why this
# repository ships no disk image and no installer: the "installation" is
# `dd` the rootfs onto a disk, or boot the UKI, and let repart lay out the rest.
[Partition]
Type=esp
Format=vfat
# Big enough for several UKIs side by side, which is what makes an A/B
# systemd-sysupdate rollout possible without repartitioning.
SizeMinBytes=512M
SizeMaxBytes=512M
