# /home, as its own partition.
#
# Separate so systemd-sysupdate can replace the root partition wholesale
# without touching user data, and so systemd-homed's per-user LUKS images have
# somewhere to live that survives an A/B update.
[Partition]
Type=home
Format=ext4
SizeMinBytes=4G
# No maximum: repart gives it the rest of the disk.
Weight=1000
