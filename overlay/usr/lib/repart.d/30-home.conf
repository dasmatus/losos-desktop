# /home, as its own partition.
#
# Separate so systemd-sysupdate can replace the root partition wholesale
# without touching user data, and so systemd-homed's per-user LUKS images have
# somewhere to live that survives an A/B update.
[Partition]
Type=home
# The partition a factory reset removes and recreates.
#
# systemd-repart deletes every partition marked this way when the system boots
# with a factory reset in effect, then creates it anew from this same file. So
# "factory reset" is not a script that walks the filesystem deleting things --
# it is the absence of a partition, and the same code path that created it on
# first boot creates it again.
#
# Root is deliberately NOT marked: /usr lives on it, so removing it would take
# the operating system with it. What that costs is that state under /etc and
# /var survives a reset; see docs/factory-reset.md for why that is the
# conservative half and what would be needed to move /var off root.
FactoryReset=yes
Format=ext4
SizeMinBytes=4G
# No maximum: repart gives it the rest of the disk.
Weight=1000
