# A/B updates of the root filesystem.
#
# The second root partition is created empty by systemd-repart and filled by
# sysupdate; the booted one is never written. Paired with dm-verity this is
# what makes /usr immutable in a way that survives an update rather than
# being reset by one.
[Transfer]
ProtectVersion=%A

[Source]
Type=url-file
Path=https://example.invalid/losos-desktop/
MatchPattern=losos-desktop_@v.root-x86-64.raw.xz

[Target]
Type=partition
Path=auto
MatchPattern=losos-desktop_@v
MatchPartitionType=root-x86-64
InstancesMax=2
