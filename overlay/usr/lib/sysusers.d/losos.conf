# System users, created by systemd-sysusers on first boot.
#
# /etc ships essentially empty, so there is no /etc/passwd in the image at all;
# sysusers writes one the first time the system comes up. Ordinary human users
# are not here -- those are systemd-homed records, created by homectl, and they
# live on the home partition rather than in a file.
u gdm     - "GNOME Display Manager" /var/lib/gdm /usr/sbin/nologin
u polkitd - "polkit"                /                     /usr/sbin/nologin
u systemd-oom - "systemd Userspace OOM Killer" / /usr/sbin/nologin
g wheel   -
g video   -
g input   -
g render  -
