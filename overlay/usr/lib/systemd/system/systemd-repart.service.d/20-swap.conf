[Unit]
# The installer partitions its selected target through sysinstall instead;
# never try to reserve RAM-sized swap on the live USB/DVD itself.
ConditionKernelCommandLine=!losos.install

[Service]
# In the initrd repart searches beneath /sysroot, so stage the generated
# definition there and keep the vendor ExecStart entirely unchanged.
ExecStartPre=/usr/lib/losos/losos-swap /sysroot/run/repart.d
