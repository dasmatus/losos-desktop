[Unit]
# The installer partitions its selected target through sysinstall instead;
# never try to reserve RAM-sized swap on the live USB/DVD itself.
ConditionKernelCommandLine=!losos.install

[Service]
ExecStartPre=/usr/lib/losos/losos-swap /run/repart.d
# In the initrd repart otherwise searches beneath /sysroot, missing the
# definition just written to /run. Explicit directories affect definitions,
# not its automatic selection of the boot disk. Keep administrator overrides.
ExecStart=
ExecStart=/usr/bin/systemd-repart --dry-run=no --definitions=/sysroot/etc/repart.d --definitions=/etc/repart.d --definitions=/run/repart.d --definitions=/usr/local/lib/repart.d --definitions=/usr/lib/repart.d
