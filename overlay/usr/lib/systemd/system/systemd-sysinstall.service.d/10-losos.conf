# Make the installer the installer medium's reason for existing -- and nothing
# at all on an installed system.
#
# systemd ships systemd-sysinstall.service with no [Install] section, because
# upstream cannot know which images are installer media. This OS builds two
# UKIs from one root filesystem, so the answer has to be decided at boot rather
# than at build time: the installer UKI's command line carries `losos.install`
# and the ordinary one does not.
#
# A failed condition is not a failed unit, so on an installed system this is
# enabled, skipped, and silent. That matters more than it looks: the unit
# carries FailureAction=halt, and a unit that could fail on a normal boot would
# halt the machine.
[Unit]
ConditionKernelCommandLine=losos.install

[Install]
WantedBy=multi-user.target
