# Let systemd-oomd act on a desktop session before the kernel OOM killer does.
#
# The kernel's OOM killer runs when memory is already exhausted and picks by
# badness score, which on a desktop usually means killing the compositor. oomd
# watches cgroup pressure instead and kills the worst-behaved *application*
# cgroup while the machine is still responsive -- but only for slices that opt
# in, which is what this drop-in does for every user session.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=50%
