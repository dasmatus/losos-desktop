# The target disk's EFI system partition.
#
# Same size as the booted system's, and for the same reason: several UKIs side
# by side, so an A/B systemd-sysupdate rollout never has to repartition.
# systemd-sysinstall runs `bootctl install` and `bootctl link` against this
# afterwards.
[Partition]
Type=esp
Format=vfat
SizeMinBytes=512M
SizeMaxBytes=512M
