# The target disk's /home.
#
# Created empty, and NOT marked FactoryReset=yes here -- the file that governs
# a factory reset is the one on the installed system
# (/usr/lib/repart.d/30-home.conf), which is copied across with the root
# partition. Marking it in both places would be harmless and misleading: this
# directory is read only by the installer, which never performs a reset.
[Partition]
Type=home
Format=ext4
SizeMinBytes=4G
Weight=1000
