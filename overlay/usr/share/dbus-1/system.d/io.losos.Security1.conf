<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Who may own the name, and who may ask it questions.

  Read access is deliberately open to everyone. The report says whether this
  machine has a TPM, an encrypted disk and a locked-down kernel; it contains no
  secret, and restricting it would mean the Settings panel needed a polkit
  dance to show the user facts about their own computer. There is no method
  here that changes anything, so there is nothing to authorise.
-->
<busconfig>

  <policy user="root">
    <allow own="io.losos.Security1"/>
  </policy>

  <policy context="default">
    <allow send_destination="io.losos.Security1"
           send_interface="io.losos.Security1"/>
    <allow send_destination="io.losos.Security1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="io.losos.Security1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.losos.Security1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>

</busconfig>
