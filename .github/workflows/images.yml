# Build, verify and publish the sysupdate images.
#
# The matrix is architecture x channel. `nightly` is built on a schedule and
# from main; `stable` only from a tag. Both publish to a GitHub release whose
# tag IS the channel name and which is moved rather than recreated, because
# systemd-sysupdate's Source Path= has to be a stable URL -- it fetches
# SHA256SUMS from that directory to discover what versions exist.
name: images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Nightly, off the hour: a cron on the hour competes with everyone else's.
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only by default. This workflow runs on pull_request, which means it
# checks out and executes branch code; a token that can write to the repository
# has no business being in that job. Only `publish` needs more, and it asks for
# it itself.
permissions:
  contents: read

jobs:
  # The channel, decided once. It used to be derived independently in `build`
  # (into $GITHUB_ENV) and again in `publish` (in shell), while `verify` and
  # `ota` just hardcoded "nightly" -- so on a tag, build uploaded
  # losos-stable-<arch> and verify asked for losos-nightly-<arch>, which does
  # not exist. download-artifact fails on a missing name, so verify and ota
  # failed and publish (needs: [verify, ota]) never ran: the stable release
  # path could not complete at all. One output, referenced everywhere.
  channel:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.pick.outputs.name }}
    steps:
      - id: pick
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=stable" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
          fi

  # The gate that runs anywhere, on every event. No network to upstream, no
  # KVM, no nix. If this is red nothing below is worth running.
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: losos-desktop }
      - uses: actions/checkout@v4
        # Pinned, not `master`. tools/gates/plugins.py compares
        # plugins/wit/plugin.wit byte for byte against this checkout's copy,
        # so following pm's tip makes this repository's CI a function of
        # another repository's HEAD: when pm merged its plugin contract
        # change, every open pull request here went red on a tree nobody had
        # touched. This is the commit the vendored contract is a copy of.
        with: { repository: dichhead/pm, path: pm, ref: 145bae94bf170a9779029abdb41777ea380dc9f0 }

      - name: Install the toolchain the gates need
        run: |
          sudo apt-get update
          # libclang-rt-*-dev is not optional: without it clang errors out on
          # -fsanitize=cfi with a missing ignorelist, and the toolchain report
          # cannot tell whether CFI works.
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm libclang-rt-18-dev python3-yaml

      # pm's jail is a user namespace, and Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1, which denies the
      # uid_map write hakoniwa needs. Without this every pm build fails with
      # "Operation not permitted" from inside the sandbox -- which reads like a
      # permissions problem with the workspace and is not.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build pm
        run: cargo build --release --manifest-path pm/Cargo.toml

      # The components are not committed, so CI builds them -- and this is the
      # only place `explain-all` runs with the plugins actually loaded. It needs
      # the wasm32 target and pm's encoder, which is why it is not part of
      # `./do check` (that has to run with no network and no wasm toolchain).
      - name: Build the plugin components
        run: |
          rustup target add wasm32-unknown-unknown
          cd losos-desktop && PM_ROOT=$GITHUB_WORKSPACE/pm ./do plugins

      - name: ./do check
        working-directory: losos-desktop
        run: PM=$GITHUB_WORKSPACE/pm/target/release/pm ./do check

      # Proves the flag set compiles, links, runs, and that a mistyped indirect
      # call is actually caught -- not that a YAML file says CFI is on.
      - name: Toolchain report
        working-directory: losos-desktop
        run: python3 tools/gates/toolchain-report.py --verify-cfi

  # The same gate, in the build host this repository describes rather than in
  # whatever the runner image happens to have installed. It is slower -- the
  # image is built from scratch on every run until it is published to a
  # registry -- and it is the only job that can fail when the Containerfile is
  # wrong, which the job above cannot, because that one installs its own
  # dependencies with apt.
  #
  # `./do container` passes the seccomp and AppArmor options pm's user
  # namespace needs; GitHub's runners allow both.
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: losos-desktop }
      - uses: actions/checkout@v4
        # The same pin as `gates` and `build`, for the same reason: a gate run
        # against a different pm than the others approved is checking a tree
        # nobody else checked.
        with: { repository: dichhead/pm, path: pm, ref: 145bae94bf170a9779029abdb41777ea380dc9f0 }

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build the build host
        working-directory: losos-desktop
        run: ./do container build

      # Everything from here runs inside the image, including pm and the
      # plugin components: the point of this job is that the binary and the
      # components the gate uses are the ones a developer following
      # docs/container.md would get, not the runner's.
      - name: Run the gate inside it
        working-directory: losos-desktop
        run: |
          python3 tools/container run cargo build --release \
            --manifest-path "$GITHUB_WORKSPACE/pm/Cargo.toml"
          ./do container plugins
          ./do container check

  # Whether the sources are pinned decides whether anything below can run at
  # all. Reported as an output rather than a failure: an unpinned tree is the
  # normal state while a distribution is being brought up, and it should not
  # turn every push red.
  pinned:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if grep -q 'sha256: TODO' manifest/sources.lock; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::sources.lock has unpinned entries; image jobs will be skipped."
            grep -c 'sha256: TODO' manifest/sources.lock
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  # TEMPORARY, and not meant to reach the default branch.
  #
  # The permanent home for this is .github/workflows/pin-sources.yml, but a
  # workflow_dispatch workflow is only dispatchable once its file exists on the
  # repository's DEFAULT branch -- and that file is on a topic branch, so the
  # API answers 404. Dispatching an already-registered workflow, on the other
  # hand, runs the file as it exists on the dispatched ref. So the fetch is
  # bootstrapped from here until pin-sources.yml has landed, at which point
  # this job goes away.
  #
  # It commits the lock rather than only uploading it, because the artifact
  # lands in blob storage that the environment this is driven from cannot
  # reach. The hashes are written by tools/fetch-sources from the bytes it
  # actually downloaded; nothing here composes one.
  pin-bootstrap:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install what the fetcher needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml

      - name: Make room for the mirror
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      # Three upstreams moved and their old URLs now 404. The replacements are
      # committed, but qrencode's is a git archive for want of a dist tarball,
      # so this reports whether a real one has reappeared anywhere reachable --
      # a runner can see hosts the development environment cannot.
      - name: Probe the upstreams that moved
        if: always()
        run: |
          for u in \
            https://fukuchi.org/works/qrencode/qrencode-4.1.1.tar.gz \
            https://fukuchi.org/works/qrencode/qrencode-4.1.1.tar.bz2 \
            https://deb.debian.org/debian/pool/main/q/qrencode/qrencode_4.1.1.orig.tar.bz2 \
            https://gitlab.freedesktop.org/polkit/polkit/-/archive/125/polkit-125.tar.gz ; do
            printf '%s -> %s\n' "$u" "$(curl -sS -o /dev/null -L --max-time 30 -w '%{http_code}' "$u" || echo error)"
          done

      # --update is what fills a TODO. It exits non-zero if anything is still
      # unavailable, and the lock is committed either way: 99 resolved hashes
      # are worth keeping even when the hundredth is not.
      - name: Fetch every source and record its hash
        id: fetch
        continue-on-error: true
        run: python3 tools/fetch-sources --update

      - name: Commit the resolved lock
        if: always()
        run: |
          echo "unresolved after this run: $(grep -c 'sha256: TODO' manifest/sources.lock || true)"
          if git diff --quiet -- manifest/sources.lock; then
            echo "lock unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest/sources.lock
          git commit \
            -m "chore: pin upstream source hashes" \
            -m "Written by tools/fetch-sources --update from the bytes it downloaded, on a runner that can reach the hosts manifest/sources.lock names. No hash here was composed by hand: pm verifies a dl_urls digest before it parses the build file, so a wrong value is indistinguishable from a compromised mirror."
          git push origin HEAD:${GITHUB_REF_NAME}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sources-lock
          path: manifest/sources.lock

  build:
    needs: [gates, pinned, channel]
    if: needs.pinned.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # GitHub's arm64 runners, so aarch64 builds and boots natively
          # instead of under TCG. A cross-built image verified only under
          # emulation is a weaker claim and a much slower job.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: { path: losos-desktop }
      - uses: actions/checkout@v4
        # Pinned for the reason given in `gates` above: a build running
        # against a different pm than the gate approved is verifying a tree
        # that was never checked.
        with: { repository: dichhead/pm, path: pm, ref: 145bae94bf170a9779029abdb41777ea380dc9f0 }

      # pm's jail is a user namespace, and Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1, which denies the
      # uid_map write hakoniwa needs. Without this every pm build fails with
      # "Operation not permitted" from inside the sandbox -- which reads like a
      # permissions problem with the workspace and is not. It is a host
      # setting: the container below inherits it and cannot set it itself.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Everything from here runs inside the build host this repository
      # describes, rather than against an apt list kept in step with it by
      # hand. That list is how this job used to get its dependencies, and it
      # could not have built the image layer: mkosi, xorriso and qemu-img were
      # never in it, and Ubuntu's mkosi is older than the one the mkosi
      # configuration is written against either way.
      - name: Build the build host
        working-directory: losos-desktop
        run: ./do container build

      # pm is built with the image's toolchain because it is run with the
      # image's libraries. The plugin components are not committed, so they
      # are built here too -- without them pm loads no plugins, and the image
      # layer's `%{losos-mkosi:esp}` expands to nothing at all, which reads as
      # a broken recipe rather than as a missing component.
      - name: Build pm and the plugin components in it
        working-directory: losos-desktop
        run: |
          python3 tools/container run cargo build --release \
            --manifest-path "$GITHUB_WORKSPACE/pm/Cargo.toml"
          ./do container plugins

      # pm's downloader compiles Mozilla's roots in and reads no CA setting, so
      # it cannot fetch through a TLS-terminating proxy. Mirroring first and
      # serving over loopback keeps the SHA-256 pins exactly as they are.
      - name: Mirror the pinned sources
        working-directory: losos-desktop
        run: python3 tools/container run python3 tools/fetch-sources

      # The channel comes from the `channel` job, not from the event read a
      # second time here: a tag builds stable, everything else nightly, and
      # every job below has to agree on which. It is not a matrix dimension
      # because that would double every job to publish a "stable" nobody
      # tagged.
      - name: Take the channel
        run: echo "CHANNEL=${{ needs.channel.outputs.name }}" >> "$GITHUB_ENV"

      # The version is decided HERE, before the build, and not after it with
      # the artifact names. It is baked into the name of the unified kernel
      # image on the image's own ESP, and that name is the only place
      # systemd-sysupdate can read a version from: at the default an image's
      # kernel is unversioned, the first update installs a second one beside it
      # and neither can ever be retired.
      - name: Decide the version
        run: |
          # Derived from the channel rather than by reading the ref a second
          # time. The `channel` job is the one place that decides what this
          # build is, and a version that asked the ref again could disagree
          # with it.
          version="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          if [ "$CHANNEL" = stable ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "LOSOS_VERSION=$version" >> "$GITHUB_ENV"

      # The mirror is not started here any more. `./do build` starts one
      # itself on the same port, and it has to be the container's loopback
      # rather than the runner's: pm fetches from inside the image, where
      # 127.0.0.1 is not the host's.
      - name: Build the image
        working-directory: losos-desktop
        run: |
          python3 tools/container run python3 tools/configure \
            --arch ${{ matrix.arch }} --channel "$CHANNEL" \
            --version "$LOSOS_VERSION" --mirror http://127.0.0.1:8730
          python3 tools/container run ./do build losos-90-image

      - name: Name the artifacts and write SHA256SUMS
        working-directory: losos-desktop
        run: |
          python3 tools/container run python3 tools/stage-release \
            --arch ${{ matrix.arch }} --version "$LOSOS_VERSION" --out release
          python3 tools/container run python3 tools/release-manifest \
            --arch ${{ matrix.arch }} --version "$LOSOS_VERSION" release

      - uses: actions/upload-artifact@v4
        with:
          name: losos-${{ needs.channel.outputs.name }}-${{ matrix.arch }}
          path: losos-desktop/release/

  # Boot what was built. A build that produces an unbootable image is a build
  # that passed, so this is the job that makes the others mean anything.
  verify:
    needs: [build, channel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: losos-${{ needs.channel.outputs.name }}-${{ matrix.arch }}
          path: release

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
          # GitHub's Linux runners expose /dev/kvm, but the runner user is not
          # in the kvm group by default. Without this the boot still works and
          # takes twenty times as long, which reads as a hang.
          sudo chmod 666 /dev/kvm || true

      - name: Boot the kernel image
        run: |
          python3 tools/vm-test boot --arch ${{ matrix.arch }} \
            --uki release/losos-desktop_*_${{ matrix.arch }}.efi \
            --log console.log

      # The same claim about the disk this repository ships rather than about
      # the kernel inside it. Firmware has to find the ESP in the partition
      # table, load systemd-boot out of a FAT volume this repository wrote, and
      # hand the kernel a root partition found by its GPT type -- none of which
      # the step above exercises, because it stages its ESP with QEMU.
      - name: Boot the disk image
        run: |
          python3 tools/vm-test disk --arch ${{ matrix.arch }} \
            --disk release/losos-desktop_*_${{ matrix.arch }}.qcow2 \
            --log disk-console.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: console-${{ matrix.arch }}
          path: |
            console.log
            disk-console.log

  # Prove the update path, not just the boot path. A sysupdate MatchPattern
  # that matches nothing reports "no update available" rather than failing, so
  # the only way to know a transfer definition is right is to apply one.
  ota:
    needs: [build, verify, channel]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: losos-${{ needs.channel.outputs.name }}-${{ matrix.arch }}
          path: release

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-yaml \
            qemu-system-x86 qemu-system-arm ovmf qemu-efi-aarch64
          sudo chmod 666 /dev/kvm || true

      - name: Apply an update inside the VM
        run: |
          python3 tools/vm-test ota --arch ${{ matrix.arch }} \
            --uki release/losos-desktop_*_${{ matrix.arch }}.efi \
            --serve release --log ota-console.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ota-console-${{ matrix.arch }}
          path: ota-console.log

  publish:
    needs: [build, verify, ota, channel]
    # A dispatched run publishes what the build produced even if the image did
    # not boot and the update did not apply, because that is what the person
    # dispatching it asked for -- an artefact to look at, from a distribution
    # that has never completed a build. `always()` is what lets this job run at
    # all once a job it needs has failed.
    #
    # The schedule and the tag path keep the original gate: verify and ota have
    # to pass. An automated channel that published unbootable images would make
    # the nightly tag meaningless, and `losos-desktop_<v>` is a URL some
    # machine's sysupdate is pointed at.
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (needs.verify.result == 'success' && needs.ota.result == 'success'))
    runs-on: ubuntu-24.04
    # The one job that writes, and it says so here rather than at the top of
    # the file where it would also apply to every pull request.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "losos-*", path: release, merge-multiple: true }

      # The release tag is the channel, and it is moved rather than recreated:
      # sysupdate's Path= must stay the same URL across releases, because it is
      # baked into the image that is trying to update itself.
      - name: Publish to the channel release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          channel="${{ needs.channel.outputs.name }}"
          gh release delete "$channel" --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create "$channel" --repo "$GITHUB_REPOSITORY" \
            --title "LosOS $channel" --notes "Rolling $channel channel." \
            --prerelease release/*
