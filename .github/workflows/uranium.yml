# Uranium's two builds that ci.yml does not make (docs/nixos.md, "Uranium").
#
# `chromium` compiles the patched Uranium, `.#uranium-patched`, which the
# image ships with losos.uranium.patched. Chromium takes longer than one
# runner's six hours, so it compiles in rounds: each round restores the
# compiler cache it left in GHCR, builds for as long as the runner allows,
# saves the cache again, and dispatches the next round for the
# architectures that did not finish. A finished build goes to the
# project's Nix cache, where an image build substitutes it.
#
# `flatpak` packs Uranium as the Flatpak org.losos.Uranium and pushes it to
# GHCR as an OCI image, which the proxy serves at /flatpak/ as the Flatpak
# remote the OS adds (losos.uranium.flatpakRemote).
name: uranium

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/uranium.yml
      - flake.lock
      - nixos/pkgs/uranium.nix
      - nixos/pkgs/uranium/**
      - nixos/pkgs/uranium-tabs.nix
      - nixos/pkgs/patches/chromium/**
      - src/uranium-tabs/**
  pull_request:
    paths:
      - .github/workflows/uranium.yml
      - nixos/pkgs/uranium.nix
      - nixos/pkgs/uranium/**
      - nixos/pkgs/uranium-tabs.nix
      - src/uranium-tabs/**
  workflow_dispatch:
    inputs:
      arches:
        description: Architectures to compile, as a JSON list
        default: '["x86_64", "aarch64"]'
      round:
        description: Which round this is; the first starts at 1
        default: "1"
      rounds:
        description: The most rounds a chain runs before it gives up
        default: "8"

permissions:
  contents: read

# One chain at a time per branch. A push while a round runs waits for it,
# and the round's cache is what the push's build starts from.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NIX_VERSION: "2.34.8"
  # The installer script's own hash, from releases.nixos.org's install.sha256
  # for that version, as in ci.yml.
  NIX_INSTALLER_SHA256: "96c10e102c88809dd9ec0bee89200c4a51eae4c9f6d8698c26b16788d131e078"

jobs:
  # Which architectures this round compiles: both on a push, those a
  # dispatch names on a later round.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          ARCHES: ${{ inputs.arches || '["x86_64", "aarch64"]' }}
        run: |
          matrix=$(jq -c '[.[] | {arch: ., runner: (if . == "aarch64" then "ubuntu-24.04-arm" else "ubuntu-24.04" end)}]' <<< "$ARCHES")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  chromium:
    needs: [plan]
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    # packages: write is for the compiler cache and the Nix cache, both in
    # GHCR, and is used only in the steps that push them, as in ci.yml.
    permissions:
      contents: read
      packages: write
    env:
      NIX_CACHE_URL: ${{ vars.LOSOS_PROXY_URL }}
      NIX_CACHE_PUBLIC_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
      LOSOS_PROXY_URL: ${{ vars.LOSOS_PROXY_URL }}
      CCACHE_REF: ghcr.io/${{ github.repository }}/uranium-ccache:${{ matrix.arch }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell
          df -h / /mnt || true

      # Chromium's build directory is tens of gigabytes. Where the runner
      # has a second disk at /mnt, the build and the compiler cache go
      # there, and the store keeps the root disk. The cache directory is
      # bound into the sandbox, where uranium.nix's compiler wrapper finds
      # it; the build users are not root, so it is writable by all.
      - name: Install Nix
        run: |
          scratch=/var/tmp
          if [ "$(stat -c %d /mnt)" != "$(stat -c %d /)" ]; then
            scratch=/mnt
          fi
          sudo mkdir -p "$scratch/nix-build" "$scratch/uranium-ccache"
          sudo chmod 0777 "$scratch/uranium-ccache"
          echo "CCACHE_HOST_DIR=$scratch/uranium-ccache" >> "$GITHUB_ENV"
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          {
            echo "experimental-features = nix-command flakes"
            echo "system-features = nixos-test benchmark big-parallel"
            echo "max-jobs = auto"
            echo "build-dir = $scratch/nix-build"
            echo "extra-sandbox-paths = /var/cache/uranium-ccache=$scratch/uranium-ccache"
            if [ -n "$NIX_CACHE_URL" ] && [ -n "$NIX_CACHE_PUBLIC_KEY" ]; then
              echo "substituters = https://cache.nixos.org/ $NIX_CACHE_URL"
              echo "trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= $NIX_CACHE_PUBLIC_KEY"
            else
              echo "substituters = https://cache.nixos.org/"
            fi
          } | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      # The previous round's cache, if there is one. It is split into
      # parts because GHCR refuses a layer over 10 GB. ccache keys every
      # object by its preprocessed input and compiler, so a cache from an
      # older Chromium only misses; it never returns a wrong object.
      - name: Restore the compiler cache
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! oras manifest fetch "${CCACHE_REF,,}" > /dev/null 2>&1; then
            echo "No compiler cache yet; this round starts cold."
            exit 0
          fi
          oras pull "${CCACHE_REF,,}" --output "$RUNNER_TEMP/ccache"
          cat "$RUNNER_TEMP"/ccache/ccache.tar.zst.part-* \
            | sudo tar --zstd -x -C "$CCACHE_HOST_DIR"
          rm -rf "$RUNNER_TEMP/ccache"
          sudo chmod -R a+rwX "$CCACHE_HOST_DIR"
          du -sh "$CCACHE_HOST_DIR"

      - name: Fetch fixed-output inputs
        run: tools/nix-fetch-sources .#uranium-patched

      - name: Note what came prebuilt
        if: always()
        run: nix path-info --all > "$RUNNER_TEMP/prebuilt.txt"

      # Stops early enough to leave time to save the cache. Interrupted,
      # Nix kills the compile, and every object finished so far is in the
      # cache for the next round.
      - name: Build Uranium
        id: build
        run: |
          set +e
          timeout --signal=INT 290m nix build --impure -L --keep-going --out-link uranium .#uranium-patched \
            2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" = 0 ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = 124 ] && ! grep -q "^error: builder for .* failed" build.log; then
            echo "::warning::The build ran out of time with nothing failed; the next round continues from the compiler cache."
            echo "complete=false" >> "$GITHUB_OUTPUT"
          else
            grep -A40 "^error: builder for .* failed" build.log | head -120 || true
            exit 1
          fi

      # Saved after a finished build too, so the next Chromium release
      # starts from what this one shares with it.
      - name: Save the compiler cache
        if: always() && github.event_name != 'pull_request' && steps.build.outputs.complete != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          mkdir -p "$RUNNER_TEMP/ccache"
          cd "$RUNNER_TEMP/ccache"
          # ccache compresses each object already; zstd here is for the
          # index and the many small files.
          sudo tar --zstd -c -C "$CCACHE_HOST_DIR" . \
            | split -b 4G -d -a 2 - ccache.tar.zst.part-
          ls -la
          oras push "${CCACHE_REF,,}" \
            --artifact-type application/vnd.losos.ccache.v1 \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            ccache.tar.zst.part-*

      # As in ci.yml: every path this round built, so a later round or an
      # image build substitutes it instead of building it again.
      - name: Push what was built to the cache
        if: always() && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
        run: |
          if [ -z "$NIX_CACHE_SIGNING_KEY" ]; then
            echo "::warning::NIX_CACHE_SIGNING_KEY is not set, so nothing goes to the cache."
            exit 0
          fi
          trap 'rm -f "$RUNNER_TEMP/cache.sec"; oras logout ghcr.io || true' EXIT
          printf '%s' "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          umask 077
          printf '%s' "$NIX_CACHE_SIGNING_KEY" > "$RUNNER_TEMP/cache.sec"
          tools/nix-cache-push --all \
            --exclude-from "$RUNNER_TEMP/prebuilt.txt" \
            --repository "ghcr.io/${GITHUB_REPOSITORY,,}/nix-cache" \
            --secret-key-file "$RUNNER_TEMP/cache.sec"

      # A matrix job keeps only one leg's outputs, so each architecture
      # that has to go on says so in an artifact of its own.
      - name: Note that this architecture goes on
        if: always() && steps.build.outputs.complete == 'false'
        run: mkdir -p "$RUNNER_TEMP/unfinished" && touch "$RUNNER_TEMP/unfinished/${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.build.outputs.complete == 'false'
        with:
          name: unfinished-${{ matrix.arch }}
          path: ${{ runner.temp }}/unfinished/
          retention-days: 1

  # The next round, for the architectures that ran out of time. A dispatch
  # by the workflow's own token is the one event GitHub lets it start a
  # run with. A chain stops at the round limit, or as soon as a build
  # fails, since a later round would fail the same way.
  next:
    needs: [chromium]
    if: always() && needs.chromium.result != 'cancelled' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with: { pattern: "unfinished-*", path: unfinished, merge-multiple: true }
      - name: Dispatch the next round
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROUND: ${{ inputs.round || '1' }}
          ROUNDS: ${{ inputs.rounds || '8' }}
        run: |
          arches='[]'
          if [ -d unfinished ]; then
            arches=$(find unfinished -type f -printf '%f\n' | jq -Rcn '[inputs]')
          fi
          if [ "$arches" = '[]' ]; then
            echo "Nothing left to compile."
            exit 0
          fi
          if [ "$ROUND" -ge "$ROUNDS" ]; then
            echo "::error::$arches did not finish in $ROUNDS rounds."
            exit 1
          fi
          gh workflow run uranium.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f arches="$arches" -f round=$((ROUND + 1)) -f rounds="$ROUNDS"
          echo "Round $((ROUND + 1)) dispatched for $arches."

  flatpak:
    if: github.event_name != 'workflow_dispatch' || inputs.round == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Install Nix, Flatpak and flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder skopeo
          curl -sSfL --proto '=https' \
            "https://releases.nixos.org/nix/nix-$NIX_VERSION/install" -o install-nix
          echo "$NIX_INSTALLER_SHA256  install-nix" | sha256sum -c -
          sh install-nix --daemon --yes --no-channel-add
          echo "experimental-features = nix-command flakes" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }

      # The launcher, extensions, policies and static helpers come from the
      # same Nix expressions as the image's Uranium, so the two stay alike.
      - name: Build the payload
        working-directory: nixos/pkgs/uranium/flatpak
        run: |
          nix build -L --out-link "$RUNNER_TEMP/payload" ".#packages.${{ matrix.arch }}-linux.uranium.flatpakPayload"
          cp -rL "$RUNNER_TEMP/payload" payload
          chmod -R u+w payload

      - name: Build the Flatpak
        working-directory: nixos/pkgs/uranium/flatpak
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse \
            --force-clean --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build" org.losos.Uranium.yml
          flatpak build-bundle --oci "$RUNNER_TEMP/repo" "$RUNNER_TEMP/oci" org.losos.Uranium

      # The proxy's index lists the image under the name the OS's remote
      # installs, and reads its ref and metadata from the labels
      # build-bundle wrote.
      - name: Push the Flatpak to GHCR
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          skopeo copy --dest-creds "$GITHUB_ACTOR:$GHCR_TOKEN" \
            "oci:$RUNNER_TEMP/oci" \
            "docker://ghcr.io/${GITHUB_REPOSITORY,,}/flatpak:uranium-${{ matrix.arch }}"
