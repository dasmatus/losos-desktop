name: container

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - tools/container
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

# Only a complete pair may replace latest; serialize manual and push releases.
concurrency:
  group: publish-build-host
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    # On the hosted runner itself: it already has podman and buildah, and
    # tools/container needs nothing else.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Name the native image
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          echo "LOSOS_CONTAINER_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/build-host:run-${GITHUB_RUN_ID}-${ARCH}" >> "$GITHUB_ENV"
      - name: Build the build host
        run: python3 tools/container build
      - name: Smoke test the build tools
        run: |
          podman run --rm "$LOSOS_CONTAINER_IMAGE" /bin/sh -ec '
            clang --version
            rustc --version
            cargo --version
            just --version
            mkosi --version
            qemu-img --version
            xorriso -version
            python3 -c "import yaml, jinja2"
          '
      - name: Push the native image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'podman logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          podman push "$LOSOS_CONTAINER_IMAGE"

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish the multi-architecture image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          trap 'podman logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}/build-host"
          # Assemble only registry metadata; the build layers stay in GHCR.
          podman manifest create build-host \
            "docker://${image}:run-${GITHUB_RUN_ID}-amd64" \
            "docker://${image}:run-${GITHUB_RUN_ID}-arm64"
          podman manifest push --all build-host "docker://${image}:sha-${GITHUB_SHA}"
          podman manifest push --all build-host "docker://${image}:latest"
