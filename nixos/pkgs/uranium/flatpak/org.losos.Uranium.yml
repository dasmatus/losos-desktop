# Uranium as a Flatpak, which .github/workflows/uranium.yml builds and
# pushes to GHCR and the proxy serves as a Flatpak OCI remote
# (docs/nixos.md, "Uranium").
#
# Chromium here is upstream ungoogled-chromium's portable Linux build of
# the version nixpkgs packages: one built in the store links its libraries
# from /nix/store, which no Flatpak has. Everything else is `payload`, which
# the workflow builds with `nix build .#uranium.flatpakPayload` and copies
# next to this file: the launcher, the two extensions, the policies and the
# static tabs host and wayland-info.
#
# The Chromium base app carries cobalt, which lets Chromium sandbox its
# renderers inside Flatpak's sandbox, and the libraries Chromium needs that
# the freedesktop runtime lacks.
app-id: org.losos.Uranium
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.chromium.Chromium.BaseApp
base-version: '25.08'
command: uranium
separate-locales: false
finish-args:
  # What Flathub's Chromium asks for: the GPU and cameras, the display, sound,
  # and the network.
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --socket=pcsc
  - --filesystem=xdg-download
  - --filesystem=/run/.heim_org.h5l.kcm-socket
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.gnome.SessionManager
  - --system-talk-name=org.freedesktop.UPower
  - --own-name=org.mpris.MediaPlayer2.chromium.*
  # derisk's agent socket, which the tabs host registers the tabs on.
  - --filesystem=xdg-run/derisk
modules:
  - name: chromium
    buildsystem: simple
    build-commands:
      - mkdir -p /app/uranium
      - cp -a . /app/uranium
      # Chromium looks for its policies and native messaging hosts in
      # /etc/chromium, which a Flatpak cannot add to. /app/chromium is as
      # long, so the binary keeps every offset; the counts make a Chromium
      # that moved the strings fail here rather than lose its policies.
      - test "$(grep -c -a /etc/chromium/ /app/uranium/chrome)" -ge 1
      - perl -0777 -pi -e 's{/etc/chromium/}{/app/chromium/}g' /app/uranium/chrome
      - test "$(grep -c -a /etc/chromium/ /app/uranium/chrome)" = 0
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/154.0.8037.97-1/ungoogled-chromium-154.0.8037.97-1-x86_64_linux.tar.xz
        sha256: 9529d5829ee58b22d97d0f4d6d5f9afaa4ce6cb34e591ac324be0cf3fa51f8e6
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/ungoogled-software/ungoogled-chromium-portablelinux/releases/download/154.0.8037.97-1/ungoogled-chromium-154.0.8037.97-1-arm64_linux.tar.xz
        sha256: 594c337b1d35e0a8b9eb9233740498a8fdab386e22602412e26d12b0ef4a09f1
  - name: uranium
    buildsystem: simple
    build-commands:
      - cp -a . /app
      # Chromium reads a new profile's first preferences from beside its
      # own binary when no distribution patch moves them.
      - cp /app/chromium/initial_preferences /app/uranium/initial_preferences
    sources:
      - type: dir
        path: payload
