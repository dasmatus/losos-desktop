# ---- fwupd and its stack -------------------------------------------------
# Firmware updates, and the firmware half of the security report. The panel is
# already in gnome-control-center and hides itself when org.freedesktop.fwupd
# is not on the bus, so this stack is the whole of that half.
#
# Four libraries a 1.9-era fwupd needed are deliberately absent, because 2.0
# dropped all four and adding them back would be adding dependencies nothing
# links against: libgusb (2.0 talks to libusb directly), gcab (cabinets go
# through libarchive now), efivar (a FreeBSD-only dependency here -- on Linux
# fwupd reads efivarfs itself) and protobuf-c (wanted only by the Logitech
# bulk-controller plugin, which this build disables).
