# Upstream sources, pinned by SHA-256.
#
# pm verifies a dl_urls hash BEFORE it parses the build file, so a wrong value
# presents as a compromised mirror -- which is why nothing here is ever guessed.
# `TODO` is a sentinel meaning "not yet fetched"; tools/fetch-hashes fills it in
# on a machine that can reach the host, and tools/configure refuses to generate
# while any remain unless you pass --allow-unresolved.
#
# The URL is hashed by pm as rust-url's NORMALISED form (C9), so every URL here
# must already be in that form: https, lowercase host, no default port, no
# dot-segments, no query, no fragment. tools/gates/url-canonical.py enforces it.
#
# Every `version:` is QUOTED, and must stay quoted. Unquoted, YAML reads 2.70 as
# the float 2.7 and 1.50 as 1.5, so @VERSION_LIBCAP@ rendered "2.7" -- a
# directory name that does not exist, in a recipe that looked correct.
# tools/gates/versions.py compares these against each recipe's own `version:`
# list and reports the truncation as a mismatch.

