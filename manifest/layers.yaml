# The build graph, bottom to top.
#
# Seven bundles, not ninety package nodes. pm has no build cache and copies each
# dependency's entire archive into its dependent (C5, C6 in
# docs/pm-constraints.md), so a wide DAG would rebuild the world on every
# attempt and duplicate the base layer's bytes into every leaf. A chain of
# bundles keeps the nesting at the layer count.
#
# Each layer depends on the one before it. `members` is the build order WITHIN
# the layer, and it matters: a bundle is one workspace, and a later member
# links against the sysroot the earlier ones populated.


- name: losos-00-hosttools
  dir: 01-hosttools
  # Build-time programs. meson is first because it is not installed on any
  # build host we target and cannot be: pm resolves a step's first word on the
  # HOST (C3), so meson is vendored and invoked as `python3 <meson.py>` after.
  # gperf, flex and msgfmt reach later builds through a meson native file, for
  # the same reason -- never through PATH.
  members:
    - meson
    - gperf
    - flex
    - gettext

- name: losos-05-core
  dir: 10-core
  # The parts of the OS this repository writes rather than fetches.
  members:
    - losos-release

- name: losos-10-base
  dir: 00-base
  # The libraries systemd's maximal option set needs. Nothing here is
  # optional: every entry is named by a -D<feature>=enabled in the systemd recipe.
  members:
    - zlib
    - xz
    - zstd
    - lz4
    - libffi
    - pcre2
    - libcap
    - libxcrypt
    - attr
    - acl
    - util-linux
    - kmod
    - expat
    - dbus
    - libseccomp
    - libunistring
    - libidn2
    - openssl
    - curl
    - libmicrohttpd
    - libqrencode
    - libgpg-error
    - libgcrypt
    - json-c
    - popt
    - cryptsetup
    - tpm2-tss
    - libcbor
    - libfido2
    - linux-pam
    - nettle
    - libtasn1
    - p11-kit
    - gnutls
    - libarchive
    - elfutils
    - libbpf
    - libpwquality
    - libxml2

- name: losos-20-systemd
  dir: 10-systemd
  # The kernel and systemd. bpftool comes out of the kernel tree, so linux
  # builds before systemd, which needs it for -Dbpf-framework.
  members:
    - linux
    - systemd

- name: losos-30-graphics
  dir: 20-graphics
  # Wayland, KMS and the text stack. No Xorg anywhere: mutter is built
  # -Dx11=false and gtk4 -Dx11-backend=false.
  members:
    - wayland
    - wayland-protocols
    - libdrm
    - mesa
    - mtdev
    - libevdev
    - libinput
    - xkeyboard-config
    - libxkbcommon
    - pixman
    - libpng
    - libjpeg-turbo
    - freetype
    - fontconfig
    - fribidi
    - harfbuzz
    - cairo
    - graphene
    - libepoxy
    - gdk-pixbuf
    - pango

- name: losos-40-gnome
  dir: 30-gnome
  # The session. Order is dependency order -- glib first because everything
  # above it is a GObject library, gdm and the shell last. This is the long
  # tail and the least complete layer by construction; see docs/limits.md.
  members:
    - glib
    - gobject-introspection
    - json-glib
    - libsoup
    - at-spi2-core
    - dconf
    - gsettings-desktop-schemas
    - gtk4
    - libadwaita
    - polkit
    - accountsservice
    - upower
    - libsecret
    - libnotify
    - gcr
    - gnome-keyring
    - gnome-desktop
    - gjs
    - mutter
    - gnome-shell
    - gnome-session
    - gnome-settings-daemon
    - gdm
    - gnome-control-center
    - nautilus
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome

- name: losos-90-image
  dir: 90-image
  # Merge the closure, write the initramfs and the UKI, tar the rootfs.
  members:
    - losos-image
