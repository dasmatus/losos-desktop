# The build graph, bottom to top.
#
# Seven bundles, not ninety package nodes. pm has no build cache and copies each
# dependency's entire archive into its dependent (C5, C6 in
# docs/pm-constraints.md), so a wide DAG would rebuild the world on every
# attempt and duplicate the base layer's bytes into every leaf. A chain of
# bundles keeps the nesting at the layer count.
#
# Each layer depends on the one before it. `members` is the build order WITHIN
# the layer, and it matters: a bundle is one workspace, and a later member
# links against the sysroot the earlier ones populated.


- name: losos-00-toolchain
  dir: 00-toolchain
  # The C library, and the two things that have to exist around it.
  #
  # First, and before meson, because everything compiled above this line is
  # compiled against musl rather than against the build host's glibc -- which
  # is what makes a package runnable on a machine other than the one that
  # built it. Order within the layer is forced: musl needs the kernel's
  # userspace headers to compile, compiler-rt needs musl to link against, and
  # libunwind is last because its shared library links against compiler-rt's
  # crt objects out of the resource directory compiler-rt has just staged.
  members:
    - linux-headers
    - musl
    - compiler-rt
    - libunwind

- name: losos-01-meson
  dir: 00-meson
  # meson alone, and at the very bottom, because every layer above configures
  # with it. It is not installed on any build host we target and cannot be:
  # pm resolves a step's first word on the HOST (C3), so meson is vendored
  # here and invoked as `python3 <meson.py>` everywhere after.
  #
  # Kept apart from the other host tools on purpose. gperf, flex and msgfmt are
  # needed only by systemd and the kernel, and putting them here would make
  # every lower layer unbuildable until all four were fetched.
  members:
    - meson

- name: losos-05-core
  dir: 10-core
  # The parts of the OS this repository writes rather than fetches.
  #
  # losos-security is a cargo build, and pm derives the network capability per
  # build file rather than per step (C8) -- so this whole layer's jail shares
  # the host network, losos-release included. Named here as well as in the
  # recipe because a layer is the unit that carries the consequence.
  members:
    - losos-release
    - losos-security

- name: losos-10-base
  dir: 00-base
  # The libraries systemd's maximal option set needs. Nothing here is
  # optional: every entry is named by a -D<feature>=enabled in the systemd recipe.
  members:
    - zlib
    - xz
    - zstd
    - lz4
    - libffi
    - pcre2
    - libcap
    - libxcrypt
    - attr
    - acl
    - util-linux
    - kmod
    - expat
    - dbus
    - libseccomp
    - libunistring
    - libidn2
    - openssl
    - curl
    - libmicrohttpd
    - libqrencode
    - libgpg-error
    - libgcrypt
    - json-c
    - popt
    - cryptsetup
    - tpm2-tss
    - libcbor
    # Headers and a .pc only, with nothing compiled. The real libfido2 is in
    # losos-20-systemd, after systemd, because it needs libudev to compile
    # while systemd needs only its headers to configure and dlopens the
    # library at runtime. The recipe has the whole argument.
    - libfido2-headers
    - linux-pam
    - nettle
    - libtasn1
    - p11-kit
    - gnutls
    - libarchive
    - elfutils
    - libbpf
    - libpwquality
    - libxml2

- name: losos-15-hosttools
  dir: 01-hosttools
  # The build-time programs systemd and the kernel look up for themselves.
  # They reach those builds through a meson native file or an explicit make
  # variable, never through PATH -- pm cannot put a pm-built program there (C3).
  members:
    - gperf
    - flex
    - gettext

- name: losos-20-systemd
  dir: 10-systemd
  # The kernel and systemd. bpftool comes out of the kernel tree, so linux
  # builds before systemd, which needs it for -Dbpf-framework.
  members:
    - linux
    - nvidia-open
    - systemd
    # After systemd, and this is the only reason it is not down in
    # losos-10-base with libcbor: libfido2 hard-requires libudev on Linux, and
    # systemd is the only thing in this distribution that provides it. The
    # dependency does not run the other way -- systemd keeps only includes and
    # compile args from libfido2 and dlopens it at runtime -- so libfido2-headers
    # satisfies systemd's configure from the base layer and the library itself
    # lands here.
    - libfido2

- name: losos-30-graphics
  dir: 20-graphics
  # Wayland, KMS and the text stack. No Xorg anywhere: mutter is built
  # -Dx11=false and gtk4 -Dx11-backend=false.
  members:
    - wayland
    - wayland-protocols
    - libdrm
    - mesa
    - mtdev
    - libevdev
    - libinput
    - xkeyboard-config
    - libxkbcommon
    - pixman
    - libpng
    - libjpeg-turbo
    - freetype
    - fontconfig
    - fribidi
    - harfbuzz
    - cairo
    - graphene
    - libepoxy
    - gdk-pixbuf
    - pango

- name: losos-40-gnome
  dir: 30-gnome
  # The session. Order is dependency order -- glib first because everything
  # above it is a GObject library, gdm and the shell last. This is the long
  # tail and the least complete layer by construction; see docs/limits.md.
  members:
    - glib
    - gobject-introspection
    - json-glib
    - libsoup
    - at-spi2-core
    - dconf
    - gsettings-desktop-schemas
    - gtk4
    - libadwaita
    - polkit
    - accountsservice
    - upower
    - libsecret
    - libnotify
    - gcr
    - gnome-keyring
    - gnome-desktop
    - gjs
    - mutter
    - gnome-shell
    - gnome-session
    - gnome-settings-daemon
    - gdm
    # fwupd and its stack, before the panel that reads it -- not because
    # gnome-control-center links against fwupd (it does not; the whole
    # relationship is one D-Bus name), but because a reader looking for what
    # supplies the security shield should find it just above.
    - libusb
    - libxmlb
    - libjcat
    - sqlite
    - fwupd
    - gnome-control-center
    - nautilus
    - xdg-desktop-portal
    - xdg-desktop-portal-gnome

- name: losos-90-image
  dir: 90-image
  # Merge the closure, write the initramfs and the UKI, tar the rootfs.
  members:
    - losos-image
