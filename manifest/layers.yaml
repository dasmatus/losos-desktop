# The build graph, bottom to top.
#
# Six bundles, not ninety package nodes. pm has no build cache and copies each
# dependency's entire archive into its dependent (C5, C6), so a wide DAG would
# rebuild the world on every attempt and duplicate the base layer's bytes into
# every leaf. A chain of bundles keeps nesting at the layer count.
#
# Each layer depends only on the one above it in this list. `members` is the
# build order within the layer, and it matters: a bundle is one workspace, and
# a later member links against the sysroot the earlier ones populated.

- name: losos-00-hosttools
  dir: 00-hosttools
  # Build-time programs that must exist before anything can be configured.
  # meson is first because it is not installed on any build host we target and
  # cannot be: pm resolves a step's first word on the HOST (C3), so meson is
  # vendored here and invoked as `python3 <meson.py>` everywhere after.
  members:
    - meson

- name: losos-10-core
  dir: 10-core
  # The parts of the OS this repository writes itself, rather than fetching.
  members:
    - losos-release
