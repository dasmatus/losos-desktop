# The toolchain every package is built with.
#
# One place, because a hardening flag that is applied to most of a system is
# worth very little. CFI in particular is all-or-nothing in a way that is easy
# to get wrong: an indirect call through a function pointer is only checked if
# the *caller* was compiled with CFI, and a cross-DSO call is only checked if
# both sides were. A single package built without these flags is a hole that
# nothing reports.
#
# tools/configure turns this into @CC@, @CFLAGS@, @LDFLAGS@ and a meson
# native file per layer, so a recipe never spells a flag itself.

compiler:
  # clang, not gcc: CFI is a clang feature. GCC has no equivalent -- -fcf-protection
  # is a different and much weaker thing (hardware CET, coarse-grained), and
  # -fvtable-verify covers C++ vtables only.
  cc: clang
  cxx: clang++
  # The LLVM binutils. llvm-ar and llvm-nm understand LLVM bitcode; GNU ar does
  # not, so an LTO build with GNU ar produces archives whose members the linker
  # cannot see into, and the failure is a pile of undefined symbols rather than
  # anything that mentions LTO.
  ar: llvm-ar
  nm: llvm-nm
  ranlib: llvm-ranlib
  strip: llvm-strip
  objcopy: llvm-objcopy
  # mold, for the wall-clock. Every link in this tree is a ThinLTO link, and a
  # desktop is a lot of them; mold parallelises the parts of a link lld still
  # does on one thread, and the link is what is left once ThinLTO's codegen has
  # already been spread across the cores.
  #
  # The old reason for naming a linker here has not gone away: CFI needs one
  # that understands the bitcode it is merging. mold does, but not the way lld
  # does, and the difference is a host requirement rather than a detail. lld
  # has LTO built in. mold implements the GNU linker-plugin interface instead,
  # so clang drives it the way it drives a gold-compatible linker -- asked to
  # print its link line, the driver adds `-plugin .../LLVMgold.so` and
  # `-plugin-opt=thinlto` with mold and adds neither with lld. LLVMgold.so is
  # therefore load-bearing from here on, and where it lives is a packaging
  # decision rather than a fixed path: Arch ships it inside `llvm`, Debian
  # splits it into `llvm-N-linker-tools`, which `llvm-N-dev` does NOT depend
  # on. The Containerfile asks clang for it -- `clang -print-file-name=` is
  # the same lookup the driver performs -- rather than asserting either
  # layout. Without it the first link in the tree stops with
  #
  #     mold: fatal: could not open plugin file: .../LLVMgold.so
  #
  # which reads as a broken clang installation rather than as a missing
  # package. Measured both ways on clang 18: ThinLTO links, and a cross-DSO CFI
  # shared library still comes out with __cfi_check exported.
  #
  # This does not reach the kernel, which is built with `LLVM=1` and takes
  # ld.lld from that -- see recipes/10-systemd/linux. The kernel supports
  # ld.bfd and ld.lld and not mold, so that is the right answer there and lld
  # stays a host requirement.
  linker: mold

target:
  # musl rather than glibc. Smaller, simpler, and -- the reason that matters
  # here -- statically analysable in a way glibc is not: no dlopen-based NSS,
  # no lazy symbol interposition, far fewer indirect calls for CFI to have to
  # be taught about.
  #
  # postmarketOS demonstrates musl with systemd in production, so this is not
  # speculative. It is also not free: see docs/musl.md for the patch set.
  triple: x86_64-linux-musl
  sysroot: /build/sysroot
  # Which runtime library clang links, and which unwinder. Both are here
  # because clang's defaults on Linux are gcc's, and this target has no gcc:
  # the build host installs none and the sysroot holds musl and compiler-rt.
  # Left unset, the first real link in the tree -- zlib, the first package
  # above the toolchain layer -- dies with
  #
  #     ld.lld: error: cannot open crtbeginS.o: No such file or directory
  #     ld.lld: error: unable to find library -lgcc
  #
  # which reads as a broken compiler rather than as a missing flag, because
  # cmake reports it through its "is not able to compile a simple test
  # program" check. compiler-rt's own recipe sidesteps the same link with
  # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY, which is why nothing in the
  # tree saw this until a package actually linked an executable.
  #
  # rtlib settles the crt objects too, not just the library: with it clang
  # takes compiler-rt's own clang_rt.crtbegin/crtend out of its resource
  # directory by absolute path, instead of naming gcc's and finding nothing.
  # Measured by asking the driver to print its link command, with and without.
  #
  # unwindlib and cfi.trap move together: diagnose mode is what needs an
  # unwinder at all, and `none` is only correct while CFI traps. LLVM's
  # libunwind rather than libgcc_s, which is not in this sysroot and would be
  # gcc's runtime in a tree that has no gcc. -lunwind is an ordinary library
  # name and resolves through --sysroot, so unlike the runtimes this needs no
  # resource-directory change.
  rtlib: compiler-rt
  unwindlib: libunwind
  # Where clang looks for its own runtimes, its builtin headers and the CFI
  # ignorelist. Repointed at the sysroot, which is the only way the runtimes
  # this tree builds are the ones that get linked.
  #
  # clang resolves a sanitizer runtime out of its resource directory and
  # consults neither --sysroot nor -L nor -B on the way, so until this existed
  # every CFI-built package linked the BUILD HOST's copy -- compiled against
  # glibc -- into a musl binary. That is not a theoretical mismatch. It is what
  # the first such link actually did:
  #
  #     ld.lld: error: undefined symbol: dlvsym
  #     >>> referenced by interception_linux.cpp.o in archive
  #         /usr/lib/llvm-19/lib/clang/19/lib/linux/libclang_rt.cfi-aarch64.a
  #     >>> defined in: /build/sysroot/usr/lib/libc.so
  #     ld.lld: error: undefined symbol: __confstr_chk
  #     ld.lld: error: undefined symbol: __vsyslog_chk
  #
  # dlvsym is a GNU extension musl does not have, and __confstr_chk and
  # __vsyslog_chk are glibc's _FORTIFY_SOURCE symbols. Loud here; the worry
  # docs/limits.md recorded was that a link which happened to resolve would be
  # silently wrong instead.
  #
  # The directory is the compiler-rt recipe's install prefix inside the
  # sysroot, and it has to carry four things for clang, all of which that
  # recipe now puts there: lib/linux for the runtimes, lib/linux for
  # clang_rt.crtbegin/crtend (COMPILER_RT_BUILD_CRT), share/cfi_ignorelist.txt
  # which -fsanitize=cfi refuses to run without, and include/ for stddef.h and
  # the rest of clang's builtin headers, which are copied from the host clang
  # because they belong to the compiler rather than to compiler-rt.
  #
  # Kept out of /build/sysroot/usr directly, deliberately: clang's limits.h is
  # an #include_next wrapper around the libc's, and putting both in one
  # directory breaks that.
  resource_dir: /build/sysroot/usr/lib/losos-clang

lto:
  # ThinLTO, not full LTO. Full LTO on a package the size of mesa or gtk4 needs
  # more RAM than a build host reliably has and serialises the link; ThinLTO
  # keeps the cross-module optimisation that CFI requires while staying
  # parallel and incremental.
  mode: thin
  # CFI requires LTO. That is not a recommendation -- clang errors out without
  # it, because the type-id metadata CFI checks against is computed at LTO time.
  required_by_cfi: true

cfi:
  enable: true
  # Every CFI scheme clang offers except cast-strict (which is advisory) and
  # the C++-only ones we would only get from libadwaita and gjs.
  schemes:
    - cfi-icall        # indirect calls match the callee's declared type
    - cfi-vcall        # C++ virtual calls
    - cfi-nvcall       # C++ non-virtual calls through a base pointer
    - cfi-derived-cast
    - cfi-unrelated-cast
  # Cross-DSO is the one that makes this worth doing on a distribution. Without
  # it, a call from libfoo.so into libbar.so is unchecked, which on a desktop
  # is most of the calls there are. It costs a __cfi_check export per library
  # and a slower check at the boundary.
  cross_dso: true
  # Diagnose, not trap. A violation prints the file and line of the indirect
  # call that failed and the callee it was pointed at, which systemd-coredump
  # can record; a SIGILL with nothing attached says only that a program died.
  # -fsanitize-recover rides with it so the report is not the last thing the
  # process ever does.
  #
  # This costs an unwinder. -fno-sanitize-trap puts libclang_rt.cfi_diag on
  # every link line, cfi_diag walks the stack to find the call site, and the
  # walk calls _Unwind_Backtrace and _Unwind_GetIP -- which musl does not have.
  # That is what recipes/00-toolchain/libunwind is for, and why target.unwindlib
  # below names it. Tombstone: this was `true` for one commit, with a note
  # saying diagnose was unavailable because building libunwind needed the full
  # LLVM source tree. That was wrong. It needs a three-line patch declaring the
  # project, and 127 KB of tarballs.
  trap: false
  # -fvisibility=hidden is mandatory, not stylistic: CFI can only reason about
  # a function's type if it can see every definition, and a default-visible
  # symbol may be interposed at load time by something it never checked.
  visibility: hidden

hardening:
  # The ordinary set, which is cheap and which CFI does not replace.
  cflags:
    - -O2
    - -g1
    - -fstack-protector-strong
    - -fstack-clash-protection
    - -D_FORTIFY_SOURCE=3
    - -fPIC
    - -fno-plt
  ldflags:
    - -Wl,-z,relro
    - -Wl,-z,now
    - -Wl,-z,noexecstack
    - -Wl,--as-needed
    - -pie

rust:
  # The Rust side of the same argument. Rust's own CFI implementation is the
  # same LLVM feature, so a Rust library linked into a C program participates
  # in the same checks -- but only if both were built with it.
  #
  # -Zsanitizer needs nightly. On stable these are dropped and the Rust
  # packages are built with LTO alone; tools/gates/toolchain-report.py says so
  # rather than letting it pass unnoticed.
  #
  # Note what is NOT here: a linker. `compiler.linker` above reaches a package
  # through @LDFLAGS@, and a cargo build takes none -- rustc drives the link
  # itself through `cc` and lets clang pick its own default, which is neither
  # mold nor lld. That was already true when the default above was lld, so
  # moving it to mold changes nothing for Rust, and it is written down here
  # because the two readings of "the tree's linker" differ by exactly this
  # list. Closing the gap is `-Clink-arg=-fuse-ld=...`, and it wants measuring
  # against the musl target's self-contained link rather than assuming.
  flags:
    - -Cembed-bitcode=yes
    - -Clto=thin
    - -Ccodegen-units=1
    - -Crelocation-model=pic
  nightly_flags:
    - -Zsanitizer=cfi
    - -Zsanitizer-cfi-cross-dso

# Packages that cannot take the full flag set, and exactly what each drops.
#
# This list is the honest part of the CFI claim. A scheme that is "on" for a
# distribution always has exceptions; the difference between a real one and a
# marketing one is whether the exceptions are written down and counted.
# tools/gates/toolchain-report.py prints them every run, and tools/configure
# emits a separate response file per exception so a package cannot silently
# take the default set.
exceptions:
  - package: musl
    drops: [cfi, lto, target, hardening]
    why: >
      libc is the one library CFI cannot cover from the outside. musl's
      dynamic linker resolves and calls functions before any CFI runtime
      exists, and its internal dispatch (syscall wrappers, locale callbacks,
      the stdio vtable) is type-punned in ways cfi-icall rejects by design.
      Android ships CFI across its userspace and exempts bionic for the same
      reason. Every call INTO musl from a CFI-built caller is therefore
      unchecked at the callee side.

      It also drops `target` and `hardening`, for reasons specific to building
      a libc rather than building against one. --sysroot names a sysroot musl
      is in the middle of creating, so it is empty when musl configures.
      -D_FORTIFY_SOURCE is circular: it expands calls into musl's own __*_chk
      functions, which do not exist yet. -fPIC and -pie fight musl's own build,
      which decides those per output because libc.so and libc.a need different
      answers.

      It drops LTO too, which this file used to say it kept. The dynamic
      linker is why. ldso/dlstart.c calls __dls2, a hidden symbol defined in
      ldso/dynlink.c and reached from nowhere else, on a path that runs before
      relocation; ThinLTO sees no live reference and internalises it away, and
      linking libc.so fails with `undefined hidden symbol: __dls2 ... did you
      mean __dls3`. It is not a flag that can be dropped for ldso alone, since
      an exception here is per package. Nothing is lost that CFI needed: musl
      already drops CFI, and LTO is only mandatory for the packages that keep
      it.
  - package: libunwind
    drops: [cfi, lto, unwindlib, stdlibxx]
    why: >
      The unwinder cannot be handed itself. --unwindlib=libunwind on
      libunwind's own shared link resolves to the library being linked, so
      `unwindlib` is droppable on its own here and nowhere else; everything
      else in `target` is kept, because unlike musl this does build against a
      sysroot that already holds a libc and compiler-rt's crt objects.

      Dropping it means --unwindlib=none, which is not the same as leaving the
      flag off: off means clang's build-time default, and the Containerfile's
      clang defaults to libgcc even under --rtlib=compiler-rt. No sysroot here
      has libgcc_s. tools/lib/toolchain.py carries the measurement.

      `stdlibxx` is the same argument one language over: most of libunwind is
      C++, cmake links it with clang++, and clang++ links libstdc++ by
      default, which no musl sysroot here has and which the unwinder does not
      use. Upstream adds -nostdlib++ to its own link for this reason; it
      cannot help with cmake's project() compiler test, which links before
      any of upstream's CMakeLists has run. This is the only package that
      drops it.

      CFI and LTO come off for a reason beyond cost. cfi_diag calls into this
      library to report a violation, so instrumenting it puts the reporter
      inside the thing being reported on, and a CFI failure on the unwind path
      recurses instead of printing. It is the same argument that keeps musl
      out, one layer up.
  - package: libcap
    drops: [visibility]
    why: >
      libcap annotates no export at all -- the single visibility attribute in
      its sources marks something *hidden*, in execable.h -- so it relies on
      default visibility the way it has since before the attribute existed,
      and it ships no linker version script to make up for it. Compiled with
      -fvisibility=hidden its .so comes out with an empty dynamic symbol
      table, and the first thing to link against it is libcap's own getcap:
      `undefined reference to cap_get_file`, `cap_to_text`, `cap_free`.
      Measured both ways on 2.73, the release just above the pin: with the
      flag, zero dynamic symbols defined and progs/ fails to link; without
      it, 68 exported and the programs link. It is the same shape as zstd's
      CLI, which docs/limits.md records, except that here the symbols are the
      whole point of the package rather than an extra.

      `visibility` and not `cfi`, which is what this entry said for one
      commit. Both get the symbols back, because -fvisibility= is only on the
      line as CFI's precondition and falls off with it -- but `cfi` also
      takes the checks away from a library every unit in the system feeds
      capability text to, and it does not have to. clang 18.1.3 accepts this
      tree's whole scheme set with -fsanitize-cfi-cross-dso at
      -fvisibility=default; what it refuses is -fvisibility= missing
      altogether. So libcap keeps indirect-call checking and loses only the
      guarantee that nothing interposes its exports at load time, which for a
      library that has been default-visible since 1999 is the status quo
      everywhere else rather than a new hole.

      It keeps LTO, hardening and the target flags too.

      Do not reach for the per-scheme spelling gjs uses. Naming every scheme
      empties `kept` and drops -fvisibility= entirely, which is a third
      behaviour again, four times as long to write.
  - package: libxcrypt
    drops: [cfi, lto]
    why: >
      Two failures stacked, and only one of them is loud. The loud one is LTO
      against symbol versioning: libxcrypt places its versioned aliases with
      `.symver` directives in inline asm, and ThinLTO does not keep the local
      definitions those name, so the link dies with `mold: fatal: LLVM gold
      plugin: <inline asm>: default version symbol crypt_r@@XCRYPT_2.0 must be
      defined`. The quiet one is the same visibility problem libcap has: a
      version script cannot export a symbol the compiler already made hidden,
      so the library links and ships with nothing in its dynamic table.

      Measured as a matrix on 4.4.36, the pinned release, with the layer's
      other flags: hidden+LTO and default+LTO both die on the .symver; hidden
      without LTO builds and exports 0 symbols; default without LTO builds and
      exports 9, `crypt@@XCRYPT_2.0` among them. So both have to go, and CFI
      goes with LTO because it cannot be had without it.

      The narrow `visibility` drop libcap uses is therefore not available
      here: it keeps the schemes, and the schemes need the LTO this package
      cannot have.
  # The rest of losos-10-base, in member order. Six packages, one fault, and
  # one piece of evidence behind all of them: none declares a single
  # `visibility("default")` anywhere in its tree -- not in its sources, not in
  # its generated `configure`, under either spelling of the attribute -- so
  # under the layer's -fvisibility=hidden each ships a library with an empty
  # dynamic symbol table. Checked against the hash-pinned tarball in
  # manifest/sources.lock, not against whatever upstream ships today.
  #
  # Four of the six ship a linker version script, which is the trap rather than
  # the reassurance: the linker makes a hidden symbol local before a version
  # node can claim it, so a `global:` list has nothing left to promote. Proved
  # on libfido2, which names 267 symbols in src/export.gnu and exported none.
  #
  # Said plainly, because it is the weaker part of this entry: these six are
  # not individually build-measured the way libcap and libxcrypt were. Nothing
  # in this tree has built them yet. What is measured is the mechanism, on the
  # same clang, and the absence of any annotation for it to spare. Each carries
  # a check-exports line naming symbols out of its own version script or
  # headers, so if one of them is somehow fine the exception costs it only
  # interposition protection, and if it is not the build says so at the package
  # instead of four layers later.
  #
  # `visibility` and not `cfi` throughout: at -fvisibility=default clang keeps
  # every scheme and cross-DSO, so none of these gives up indirect-call
  # checking. See libcap above for the measurement.
  - package: openssl
    drops: [visibility]
    why: >
      Declares its API bare -- `int SSL_connect(SSL *s);` -- with no export
      macro to hook and no visibility attribute anywhere in 3.3.2. It builds
      libcrypto and libssl from its own perl-driven Configure and derives their
      symbol lists from util/libcrypto.num and util/libssl.num, which is
      version-script machinery and cannot outrank STV_HIDDEN either.

      Giving up interposition protection on the system's crypto library is not
      nothing, and it is worth saying that openssl is default-visible on every
      distribution that ships it, so this is the status quo elsewhere rather
      than a hole opened here. CFI stays on, which is the part that would
      actually have been missed.
  - package: json-c
    drops: [visibility]
    why: >
      json-c has the hook zlib had and it is still not usable here. Every
      public header opens with `#ifndef JSON_EXPORT` / `#define JSON_EXPORT
      extern` for the non-MSVC case, which is exactly ZEXPORT's shape -- but it
      is repeated in five headers behind that guard, so whichever one an
      include order reaches first wins and a patch has to land in all of them
      identically to be sound. That is a patch worth writing once a build can
      verify it; asserting it now, with nothing able to compile json-c against
      the musl sysroot, would be a guess in a file whose whole convention is
      that nothing is guessed. If the patch lands, this entry comes out.
  - package: tpm2-tss
    drops: [visibility]
    why: >
      Public declarations return TSS2_RC and carry no decorator. It ships a
      version script per library -- tss2-esys.map, tss2-sys.map, tss2-mu.map
      and eight more -- which is the case that looks safest and is not.
      systemd reaches TPM2 through libtss2-esys, so an empty one takes
      measured boot and TPM2-bound disk encryption with it.
  - package: linux-pam
    drops: [visibility]
    why: >
      `extern int PAM_NONNULL((1,3,4)) pam_start(...)`. PAM_NONNULL is an
      attribute macro and looks like a hook, but it decorates only the
      functions that take pointers, so it is not the place an export attribute
      belongs. libpam.map lists the API and cannot rescue it.
  - package: p11-kit
    drops: [visibility]
    why: >
      Bare declarations and libp11-kit.map. It is also the reason meson
      exemptions had to work at all: p11-kit is a meson build, it has no
      CFLAGS= argument to name a response file on, and so it names
      @NATIVE_INI_P11_KIT@ instead. gnutls links it directly, which is where
      an empty one would have surfaced.
  - package: libpwquality
    drops: [visibility]
    why: >
      Bare declarations, libpwquality.map, nothing else. The smallest of the
      six and the same shape as the rest; systemd-homed asks it whether a
      password is acceptable.
  # losos-15-hosttools, all three of it. These are the one kind of package in
  # the tree that is not part of the OS being built so much as part of the
  # machinery building it, and that distinction is the whole exemption.
  - package: gperf
    drops: [cfi, lto, target]
    why: >
      A build-time program has to run on the build host, and a musl-dynamic
      binary cannot. Its interpreter is /lib/ld-musl-<arch>.so.1, and pm's jail
      mirrors the HOST's /lib read-only (C7) -- the sysroot's copy is at
      /build/sysroot/lib, which is not the absolute path compiled into the
      binary. So dropping `target` here is not a concession, it is the point:
      host libc, host sysroot, host resource directory, a binary the jail can
      execve.

      What makes this worth an exception rather than a shrug is that nothing
      catches it. recipes/10-systemd/systemd/build.yaml.in:37-38 asserts
      `test -x /build/sysroot/usr/bin/gperf` and the same for msgfmt, and
      test -x passes on a binary that cannot run; the kernel's build reaches
      LEX=/build/sysroot/usr/bin/flex
      (recipes/10-systemd/linux/build.yaml.in:63) and fails with ENOENT on a
      file that is plainly there, which reads as "flex was never installed"
      rather than as "flex is the wrong libc".

      CFI and LTO come off with it. They are a property of the shipped OS, and
      these three are not shipped code in any sense that matters -- see the
      note in docs/limits.md for the part of that sentence which is currently
      a lie.
  - package: flex
    drops: [cfi, lto, target]
    why: >
      A build-time program: the kernel's kconfig runs it. Same argument as
      gperf above, in full.
  - package: gettext
    drops: [cfi, lto, target]
    why: >
      msgfmt, which systemd runs for -Dtranslations=true. Same argument as
      gperf above, with one consequence the other two do not have: gettext
      configured against glibc finds gettext in the C library and builds no
      libintl, where configured against musl it would. Nothing in this tree
      asks for -lintl yet, so nothing breaks today; glib will, and
      docs/limits.md says so.
  - package: linux
    drops: [cfi, lto, hardening]
    why: >
      The kernel supplies its own: CONFIG_CFI_CLANG is kernel CFI, built with
      the kernel's own LTO and its own flag discipline. Userspace
      --target/--sysroot/-fPIC/-pie applied to a kernel build produces
      something that does not link, and -D_FORTIFY_SOURCE fights the kernel's
      own string routines. The kernel's config fragment turns on the kernel's
      equivalents instead.
  # losos-30-graphics. The same class as the base layer's six, found by
  # sweeping ahead of the build rather than waiting for it: none of the three
  # carries a single `visibility("default")` anywhere in its tree, and none
  # sets `gnu_symbol_visibility` in its own build either. That second half
  # matters as evidence. A project that hides its own symbols has to annotate
  # its exports or it would ship an empty library for everyone, not just for
  # us -- glib, graphene, libepoxy and libxkbcommon all do exactly that and are
  # why they are not on this list. These three instead assume the default is
  # `default`, which is true everywhere except here.
  #
  # Checked against the hash-pinned tarballs. sqlite is a fourth candidate on
  # the same evidence from its headers, and is not here because sqlite.org
  # could not be reached to verify the pinned bytes; it is written up in
  # docs/limits.md instead of guessed at.
  - package: harfbuzz
    drops: [visibility]
    why: >
      HB_EXTERN is `extern` and nothing more: hb-common.h defines it that way
      behind `#ifndef`, and the only place hb.hh redefines it is the MSVC
      branch. The `-DHB_EXTERN=` in src/meson.build is for g-ir-scanner and
      does not reach the library. pango, cairo and gtk4 all link it, so an
      empty libharfbuzz would surface three packages later as a text-shaping
      failure with no obvious cause.

      A meson build, so it names @NATIVE_INI_HARFBUZZ@ rather than a response
      file -- see p11-kit for why that is the only way.
  - package: libpng
    drops: [visibility]
    why: >
      PNG_EXPORT resolves through PNG_IMPEXP, which pngconf.h defines as empty
      on everything that is not Windows. libpng's symbol versioning does not
      help for the usual reason. cairo, gdk-pixbuf and gtk4 all link it.
  - package: libjpeg-turbo
    drops: [visibility]
    why: >
      jmorecfg.h spells its two declaration macros `#define GLOBAL(type) type`
      and `#define EXTERN(type) extern type`, which is the libjpeg API as it
      has been since 1991. Both libjpeg and libturbojpeg are affected, so both
      are checked; gdk-pixbuf is the consumer.
  - package: gjs
    drops: [cfi-vcall, cfi-nvcall, cfi-derived-cast, cfi-unrelated-cast]
    why: >
      SpiderMonkey's JIT generates code at runtime and calls into it through
      pointers no compiler saw, and its C++ uses the cast patterns the
      non-icall schemes reject. cfi-icall is kept: the JIT entry points are
      the interesting attack surface and they are ordinary indirect calls.
