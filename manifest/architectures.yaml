# The architectures this distribution targets, and everything that differs.
#
# Collected here rather than spread through the recipes because the differences
# are small, numerous and individually easy to miss: a kernel image under a
# different path, an EFI stub with a different name, a GPT type UUID that
# systemd-gpt-auto-generator matches on. Any one of them left at its x86 value
# produces an image that builds cleanly and does not boot, and the failure
# appears on hardware rather than in a log.
#
# `tools/configure --arch <name>` selects one. Everything below reaches recipes
# as an @ARCH_*@ placeholder, so no recipe spells an architecture.

x86_64:
  # The musl target triple. The toolchain's `target.triple` is derived from
  # this rather than written twice.
  triple: x86_64-linux-musl
  # Rust spells the same target differently: four fields where clang takes
  # three. Written out rather than derived, because the vendor field is not a
  # transformation of anything -- it is a literal that rustc either recognises
  # or rejects.
  rust_target: x86_64-unknown-linux-musl
  # What openssl's own Configure calls this architecture. A fifth spelling,
  # after clang's triple, rust's, the kernel's and EFI's, and like rust_target
  # it is a literal rather than a transformation: Configure matches the name
  # against Configurations/10-main.conf and exits with its usage message if it
  # does not recognise it.
  openssl_target: linux-x86_64
  # meson's spelling, and a sixth. meson validates cpu_family against its own
  # list of known architectures and stops `meson setup` on a value it does not
  # recognise, so this is a literal like the four above rather than a slice of
  # the triple. `cpu` is the narrower name a project may branch on; nothing in
  # this tree needs one narrower than the family, so the two agree.
  meson_cpu_family: x86_64
  meson_cpu: x86_64
  # What the kernel's own build system calls this architecture, and where it
  # leaves the bootable image. x86 produces a compressed bzImage; most other
  # architectures do not, which is why the path is data rather than a pattern.
  kernel_arch: x86
  kernel_image: arch/x86/boot/bzImage
  kernel_defconfig: defconfig
  # systemd builds one stub per EFI architecture and names it after the EFI
  # machine type, not the kernel's. x64 and aa64 are the EFI spellings.
  efi_stub: linuxx64.efi.stub
  efi_boot: systemd-bootx64.efi
  # The filename firmware looks for on the ESP when nothing is installed.
  efi_default: BOOTX64.EFI
  # The GPT partition type systemd-gpt-auto-generator matches to find the root
  # filesystem. Getting this wrong means no root= is discovered and the initrd
  # drops to an emergency shell that this OS does not have.
  gpt_root: root-x86-64
  gpt_root_verity: root-x86-64-verity
  # mkosi spells architectures its own way again -- neither the kernel's nor
  # EFI's. It validates the value against its own enum and exits before
  # building if it does not recognise it.
  mkosi_arch: x86-64
  # The same partition type as a raw UUID. xorriso's -append_partition takes
  # a GUID and knows none of systemd's names, so the one value is spelled
  # twice; the pair is checked by tools/gates/test-image.py.
  gpt_root_uuid: 4F68BCE3-E8CD-4DB1-96E7-FBCAF984B709
  # The suffix systemd-sysupdate's MatchPattern uses for a root partition
  # image, which must agree with gpt_root above.
  sysupdate_root: root-x86-64

aarch64:
  triple: aarch64-linux-musl
  rust_target: aarch64-unknown-linux-musl
  # What openssl's own Configure calls this architecture. A fifth spelling,
  # after clang's triple, rust's, the kernel's and EFI's, and like rust_target
  # it is a literal rather than a transformation: Configure matches the name
  # against Configurations/10-main.conf and exits with its usage message if it
  # does not recognise it.
  openssl_target: linux-aarch64
  meson_cpu_family: aarch64
  meson_cpu: aarch64
  kernel_arch: arm64
  # arm64 has no bzImage: the EFI stub is built into the uncompressed Image,
  # and that is what goes in the UKI's .linux section.
  kernel_image: arch/arm64/boot/Image
  kernel_defconfig: defconfig
  efi_stub: linuxaa64.efi.stub
  efi_boot: systemd-bootaa64.efi
  efi_default: BOOTAA64.EFI
  gpt_root: root-arm64
  gpt_root_verity: root-arm64-verity
  mkosi_arch: arm64
  gpt_root_uuid: B921B045-1DF0-41C3-AF44-4C6F280D3FAE
  sysupdate_root: root-arm64
