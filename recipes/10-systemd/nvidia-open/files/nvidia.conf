# Load the DRM/KMS half of the driver, which the compositor needs.
#
# Without modeset=1 there is no DRM device for mutter's native backend to open,
# and the session silently falls back to llvmpipe -- a failure that looks like
# "the desktop is slow" rather than like a driver that did not load.
options nvidia_drm modeset=1
# fbdev=1 gives the console a framebuffer before the session starts, so a boot
# failure is visible rather than a black screen.
options nvidia_drm fbdev=1
