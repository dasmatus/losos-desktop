<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 425" width="900" height="425" role="img">
<title>What the installer ISO does</title>
<desc>derisk installer owns the screen and the network and talks JSON lines to losos-installer serve, which owns the disks. The backend lays out the chosen disk with systemd-repart, fills slot A with systemd-sysupdate from the channel or from a LOSOS-RELEASE disk, writes GRUB on x86_64, and the machine reboots into the installed system.</desc>
<style>
text { font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #e5e7eb; }
.b { font-weight: 600; }
.t { font-weight: 600; font-size: 17px; }
.s { fill: #9aa8bc; font-size: 13px; }
.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.ms { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #9aa8bc; }
</style>
<defs><marker id="h38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="t38bdf8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#38bdf8"/></marker><marker id="h9aa8bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8bc"/></marker><marker id="t9aa8bc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa8bc"/></marker><marker id="hfbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="tfbbf24" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker></defs>
<rect width="900" height="425" rx="12" fill="#0f1524"/>
<text x="25" y="34" class="t">An install is an update into an empty slot</text>
<text x="25" y="55" class="s">What lands on the disk is what the channel serves at the time, not a copy of the medium.</text>
<rect x="25" y="90" width="210" height="74" rx="8" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="130.0" y="115.5" class="b" text-anchor="middle">derisk installer</text>
<text x="130.0" y="131.5" class="s" text-anchor="middle">tty1, the screen</text>
<text x="130.0" y="147.5" class="s" text-anchor="middle">Wi-Fi through wpa_supplicant</text>
<rect x="330" y="90" width="210" height="74" rx="8" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="435.0" y="115.5" class="b" text-anchor="middle">losos-installer serve</text>
<text x="435.0" y="131.5" class="s" text-anchor="middle">the backend, the disks</text>
<text x="435.0" y="147.5" class="s" text-anchor="middle">refuses a disk it did not list</text>
<path d="M237,127 L328,127" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)" marker-start="url(#t9aa8bc)"/>
<text x="282" y="119" class="s" text-anchor="middle">JSON lines</text>
<rect x="330" y="200" width="325" height="52" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="374" y="222.0" class="b">systemd-repart --empty=force</text>
<text x="374" y="239.0" class="s">ESP, BIOS boot, usr A and B labelled _empty</text>
<circle cx="352" cy="226" r="11" fill="#38bdf8"/>
<text x="352" y="230.5" class="b" text-anchor="middle" style="fill:#0f1524">1</text>
<rect x="330" y="264" width="325" height="52" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="374" y="286.0" class="b">systemd-sysupdate update</text>
<text x="374" y="303.0" class="s">fills slot A and the ESP with the release</text>
<circle cx="352" cy="290" r="11" fill="#38bdf8"/>
<text x="352" y="294.5" class="b" text-anchor="middle" style="fill:#0f1524">2</text>
<rect x="330" y="328" width="325" height="52" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="374" y="350.0" class="b">Reboot</text>
<text x="374" y="367.0" class="s">first boot creates root, /home and swap</text>
<circle cx="352" cy="354" r="11" fill="#38bdf8"/>
<text x="352" y="358.5" class="b" text-anchor="middle" style="fill:#0f1524">3</text>
<path d="M435,166 L435,198" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#h38bdf8)"/>
<path d="M480,252 L480,262" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<path d="M480,316 L480,326" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<rect x="683" y="235" width="202" height="58" rx="8" fill="#2d2614" stroke="#fbbf24" stroke-width="1.5"/>
<text x="784.0" y="260.0" class="b" text-anchor="middle">The channel</text>
<text x="784.0" y="277.0" class="s" text-anchor="middle">signed, over the network</text>
<rect x="683" y="310" width="202" height="72" rx="8" fill="#2d2614" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="784.0" y="334.5" class="b" text-anchor="middle">A LOSOS-RELEASE disk</text>
<text x="784.0" y="350.5" class="s" text-anchor="middle">checked with gpg first</text>
<text x="784.0" y="366.5" class="s" text-anchor="middle">no network needed</text>
<path d="M681,264 L669,264 L669,290 L657,290" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#hfbbf24)"/>
<path d="M681,346 L669,346 L669,290" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4"/>
<rect x="25" y="200" width="210" height="180" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="130" y="222" class="b" text-anchor="middle">The chosen disk</text>
<rect x="40" y="234" width="180" height="22" rx="4" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="130" y="249.5" text-anchor="middle">ESP</text>
<rect x="40" y="261" width="180" height="22" rx="4" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="130" y="276.5" text-anchor="middle">BIOS boot (x86_64)</text>
<rect x="40" y="288" width="180" height="22" rx="4" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="130" y="303.5" text-anchor="middle">usr-verity A, usr A</text>
<rect x="40" y="315" width="180" height="22" rx="4" fill="#172033" stroke="#9aa8bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="130" y="330.5" class="s" text-anchor="middle">usr-verity B, usr B: empty</text>
<rect x="40" y="342" width="180" height="22" rx="4" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="130" y="357.5" text-anchor="middle">root, /home, swap</text>
<path d="M328,226 L237,226" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#h38bdf8)"/>
<rect x="25" y="397" width="22" height="14" rx="3" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="55" y="408" class="s">written by the installer</text>
<rect x="239.39999999999998" y="397" width="22" height="14" rx="3" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="269.4" y="408" class="s">created on the first boot</text>
<rect x="460.4" y="397" width="22" height="14" rx="3" fill="#172033" stroke="#9aa8bc" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="490.4" y="408" class="s">laid out, left empty</text>
</svg>
