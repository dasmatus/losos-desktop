<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img">
<title>Boot counting: how a new version is tried and kept or given up</title>
<desc>sysupdate installs a new UKI with three tries in its name. Each start of it uses a try. Reaching boot-complete.target blesses it by removing the count. When the tries run out the loader starts the older version, and the new one is renamed to +0-3 so it stays last in the menu.</desc>
<style>
text { font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #e5e7eb; }
.b { font-weight: 600; }
.t { font-weight: 600; font-size: 17px; }
.s { fill: #9aa8bc; font-size: 13px; }
.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.ms { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #9aa8bc; }
</style>
<defs><marker id="h38bdf8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/></marker><marker id="t38bdf8" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#38bdf8"/></marker><marker id="h9aa8bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8bc"/></marker><marker id="t9aa8bc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa8bc"/></marker><marker id="ha3e635" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker><marker id="ta3e635" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a3e635"/></marker><marker id="hfb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="tfb7185" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb7185"/></marker></defs>
<rect width="900" height="300" rx="12" fill="#0f1524"/>
<text x="25" y="34" class="t">Boot counting</text>
<text x="25" y="55" class="s">systemd-boot keeps the count in the file name; GRUB keeps it in grubenv and losos-grub-bless.service renames.</text>
<rect x="25" y="120" width="215" height="70" rx="8" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="132.5" y="151.0" class="b" text-anchor="middle">sysupdate installs</text>
<text x="132.5" y="168.0" class="ms" text-anchor="middle">losos-desktop_&lt;v&gt;+3-0.efi</text>
<rect x="280" y="120" width="170" height="70" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="365.0" y="151.0" class="b" text-anchor="middle">Start it</text>
<text x="365.0" y="168.0" class="s" text-anchor="middle">one try used per start</text>
<path d="M240,155 L278,155" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#h38bdf8)"/>
<rect x="510" y="85" width="360" height="60" rx="8" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="690.0" y="111.0" class="b" text-anchor="middle">Reached boot-complete.target</text>
<text x="690.0" y="128.0" class="s" text-anchor="middle">blessed: losos-desktop_&lt;v&gt;.efi, the new default</text>
<rect x="510" y="175" width="360" height="60" rx="8" fill="#2e1a24" stroke="#fb7185" stroke-width="1.5"/>
<text x="690.0" y="201.0" class="b" text-anchor="middle">Tries ran out</text>
<text x="690.0" y="218.0" class="s" text-anchor="middle">the older version starts; the new one becomes +0-3</text>
<path d="M450,140 L480,140 L480,115 L508,115" fill="none" stroke="#a3e635" stroke-width="1.6" marker-end="url(#ha3e635)"/>
<text x="485" y="103" class="s" text-anchor="end">came up</text>
<path d="M450,170 L480,170 L480,205 L508,205" fill="none" stroke="#fb7185" stroke-width="1.6" marker-end="url(#hfb7185)"/>
<text x="485" y="228" class="s" text-anchor="end">tries used up</text>
<path d="M390,190 C390,245 340,245 340,192" fill="none" stroke="#9aa8bc" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#h9aa8bc)"/>
<text x="365" y="260" class="s" text-anchor="middle">did not come up: next start tries again</text>
</svg>
