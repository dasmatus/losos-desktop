<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img">
<title>The life of a LosOS machine and the systemd component at each step</title>
<desc>Install: the ISO runs systemd-repart and systemd-sysupdate. First boot: systemd-repart in the initrd creates slot B, root, home and swap, and derisk setup creates the first account with homectl. Every day: derisk logs people in, homed opens their LUKS home. Updates: systemd-sysupdate writes the idle slot and a new UKI, which boot counting keeps or gives up. A factory reset empties root and home.</desc>
<style>
text { font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #e5e7eb; }
.b { font-weight: 600; }
.t { font-weight: 600; font-size: 17px; }
.s { fill: #9aa8bc; font-size: 13px; }
.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.ms { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #9aa8bc; }
</style>
<defs><marker id="h9aa8bc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9aa8bc"/></marker><marker id="t9aa8bc" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#9aa8bc"/></marker><marker id="hfb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker><marker id="tfb7185" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fb7185"/></marker><marker id="hfbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="tfbbf24" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker></defs>
<rect width="900" height="300" rx="12" fill="#0f1524"/>
<text x="25" y="34" class="t">A machine's life, in systemd components</text>
<rect x="25" y="80" width="125" height="84" rx="8" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="87.5" y="108.5" class="b" text-anchor="middle">Install</text>
<text x="87.5" y="126.5" class="s" text-anchor="middle">repart lays out</text>
<text x="87.5" y="144.5" class="s" text-anchor="middle">sysupdate fills A</text>
<rect x="170" y="80" width="125" height="84" rx="8" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="232.5" y="108.5" class="b" text-anchor="middle">First boot</text>
<text x="232.5" y="126.5" class="s" text-anchor="middle">repart: B, root,</text>
<text x="232.5" y="144.5" class="s" text-anchor="middle">/home, swap</text>
<path d="M150,122 L168,122" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<rect x="315" y="80" width="125" height="84" rx="8" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="377.5" y="108.5" class="b" text-anchor="middle">Setup</text>
<text x="377.5" y="126.5" class="s" text-anchor="middle">derisk setup</text>
<text x="377.5" y="144.5" class="s" text-anchor="middle">homectl create</text>
<path d="M295,122 L313,122" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<rect x="460" y="80" width="125" height="84" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="522.5" y="108.5" class="b" text-anchor="middle">Every day</text>
<text x="522.5" y="126.5" class="s" text-anchor="middle">derisk logs in</text>
<text x="522.5" y="144.5" class="s" text-anchor="middle">homed opens home</text>
<path d="M440,122 L458,122" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<rect x="605" y="80" width="125" height="84" rx="8" fill="#2d2614" stroke="#fbbf24" stroke-width="1.5"/>
<text x="667.5" y="108.5" class="b" text-anchor="middle">Update</text>
<text x="667.5" y="126.5" class="s" text-anchor="middle">sysupdate writes</text>
<text x="667.5" y="144.5" class="s" text-anchor="middle">the idle slot</text>
<path d="M585,122 L603,122" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<rect x="750" y="80" width="125" height="84" rx="8" fill="#2d2614" stroke="#fbbf24" stroke-width="1.5"/>
<text x="812.5" y="108.5" class="b" text-anchor="middle">Reboot</text>
<text x="812.5" y="126.5" class="s" text-anchor="middle">try the new UKI,</text>
<text x="812.5" y="144.5" class="s" text-anchor="middle">bless or fall back</text>
<path d="M730,122 L748,122" fill="none" stroke="#9aa8bc" stroke-width="1.6" marker-end="url(#h9aa8bc)"/>
<path d="M812,166 L812,200 L522,200 L522,168" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#hfbbf24)"/>
<text x="667" y="218" class="s" text-anchor="middle">and again, A and B in turn</text>
<rect x="25" y="230" width="278" height="50" rx="8" fill="#2e1a24" stroke="#fb7185" stroke-width="1.5"/>
<text x="164.0" y="251.5" class="b" text-anchor="middle">Factory reset</text>
<text x="164.0" y="267.5" class="s" text-anchor="middle">FactoryReset= empties root and /home</text>
<path d="M164,230 L164,210 L232,210 L232,168" fill="none" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#hfb7185)"/>
<text x="320" y="260" class="s">back to first boot, with the same /usr</text>
</svg>
