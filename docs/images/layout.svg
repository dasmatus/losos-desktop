<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img">
<title>The disk layout of an installed PC</title>
<desc>A disk drawn left to right: BIOS boot, ESP, usr-verity A and usr A come from the image; usr-verity B, usr B, root, home and swap are created by systemd-repart on the first boot. The UKI on the ESP names the verity root hash of the slot it boots; root and home are emptied by a factory reset.</desc>
<style>
text { font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #e5e7eb; }
.b { font-weight: 600; }
.t { font-weight: 600; font-size: 17px; }
.s { fill: #9aa8bc; font-size: 13px; }
.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.ms { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #9aa8bc; }
</style>
<defs><marker id="ha3e635" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker><marker id="ta3e635" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a3e635"/></marker><marker id="hfbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="tfbbf24" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker></defs>
<rect width="920" height="330" rx="12" fill="#0f1524"/>
<rect x="25" y="120" width="66" height="78" rx="6" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="58.0" y="156.0" class="b" text-anchor="middle">BIOS</text>
<text x="58.0" y="174.0" class="s" text-anchor="middle">boot</text>
<rect x="95" y="120" width="76" height="78" rx="6" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="133.0" y="156.0" class="b" text-anchor="middle">ESP</text>
<text x="133.0" y="174.0" class="s" text-anchor="middle">UKIs</text>
<rect x="175" y="120" width="66" height="78" rx="6" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="208.0" y="156.0" class="b" text-anchor="middle">verity</text>
<text x="208.0" y="174.0" class="s" text-anchor="middle">A</text>
<rect x="245" y="120" width="131" height="78" rx="6" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="310.5" y="156.0" class="b" text-anchor="middle">usr A</text>
<text x="310.5" y="174.0" class="s" text-anchor="middle">Nix store</text>
<rect x="380" y="120" width="66" height="78" rx="6" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="413.0" y="156.0" class="b" text-anchor="middle">verity</text>
<text x="413.0" y="174.0" class="s" text-anchor="middle">B</text>
<rect x="450" y="120" width="131" height="78" rx="6" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="515.5" y="156.0" class="b" text-anchor="middle">usr B</text>
<text x="515.5" y="174.0" class="s" text-anchor="middle">next update</text>
<rect x="585" y="120" width="96" height="78" rx="6" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="633.0" y="156.0" class="b" text-anchor="middle">root</text>
<text x="633.0" y="174.0" class="s" text-anchor="middle">state only</text>
<rect x="685" y="120" width="121" height="78" rx="6" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="745.5" y="156.0" class="b" text-anchor="middle">home</text>
<text x="745.5" y="174.0" class="s" text-anchor="middle">homed LUKS</text>
<rect x="810" y="120" width="86" height="78" rx="6" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="853.0" y="156.0" class="b" text-anchor="middle">swap</text>
<text x="853.0" y="174.0" class="s" text-anchor="middle">random key</text>
<path d="M25,114 L25,106 L376,106 L376,114" fill="none" stroke="#a3e635" stroke-width="1.6"/>
<text x="200.5" y="97" text-anchor="middle" style="fill:#a3e635">Written by the image, or by the installer</text>
<path d="M380,114 L380,106 L896,106 L896,114" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
<text x="638.0" y="97" text-anchor="middle" style="fill:#38bdf8">Created by systemd-repart on the first boot</text>
<text x="25" y="34" class="t">Where the OS lives</text>
<text x="25" y="55" class="s">The OS is the Nix store on a verity-protected /usr; root holds only state.</text>
<path d="M133.0,198 L133.0,224 L208.0,224 L208.0,202" fill="none" stroke="#a3e635" stroke-width="1.6" marker-end="url(#ha3e635)"/>
<text x="103.0" y="244" class="s">usrhash= on the UKI</text>
<path d="M515.5,202 L515.5,268 L310.5,268 L310.5,202" fill="none" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#hfbbf24)" marker-start="url(#tfbbf24)"/>
<text x="413.0" y="286" class="s" text-anchor="middle">sysupdate writes the slot not in use</text>
<path d="M585,204 L585,212 L806,212 L806,204" fill="none" stroke="#fb7185" stroke-width="1.6"/>
<text x="695.5" y="231" text-anchor="middle" style="fill:#fb7185">FactoryReset=yes: emptied by a reset</text>
<text x="25" y="318" class="s">Dashed: x86_64 only. GRUB also puts its boot code in the MBR, for a PC without UEFI.</text>
</svg>
