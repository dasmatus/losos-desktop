<text x="152.5" y="332.0" class="s" text-anchor="middle">process</text>
<rect x="195" y="285" width="65" height="70" rx="8" fill="#231f3d" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="227.5" y="317.0" class="s" text-anchor="middle">web</text>
