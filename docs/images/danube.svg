<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img">
<title>How Danube is put together</title>
<desc>WebKit runs on the main thread under GLib's loop, the window on a second thread under winit's; two bounded crossbeam channels join them, commands one way and events and frames the other. Each web process runs in its own sandbox from danube-sandbox. Danube registers its tabs and menus with derisk over the agent socket, and derisk's palette and top bar send picked commands back. The whole browser runs in a Hakoniwa container.</desc>
