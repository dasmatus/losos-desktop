<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img">
<title>How the web flasher installs LosOS on a phone</title>
<desc>The flasher reads the release's SHA256SUMS and GSI files from the proxy in 32 MiB ranges into the browser's private storage, checking each hash, then writes vbmeta, init_boot or a repacked boot, and userdata in sparse pieces over WebUSB fastboot. Every other partition stays as it was.</desc>
<style>
text { font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-size: 14px; fill: #e5e7eb; }
.b { font-weight: 600; }
.t { font-weight: 600; font-size: 17px; }
.s { fill: #9aa8bc; font-size: 13px; }
.m { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 13px; }
.ms { font-family: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #9aa8bc; }
</style>
<defs><marker id="ha3e635" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/></marker><marker id="ta3e635" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#a3e635"/></marker><marker id="hfbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker><marker id="tfbbf24" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#fbbf24"/></marker></defs>
<rect width="900" height="330" rx="12" fill="#0f1524"/>
<text x="25" y="34" class="t">From the proxy to the phone, through a browser</text>
<text x="25" y="55" class="s">Nothing is written until every file matches SHA256SUMS.</text>
<rect x="25" y="100" width="170" height="110" rx="8" fill="#2d2614" stroke="#fbbf24" stroke-width="1.5"/>
<text x="110.0" y="134.0" class="b" text-anchor="middle">proxy /flasher/</text>
<text x="110.0" y="151.0" class="ms" text-anchor="middle">&lt;channel&gt;/aarch64/</text>
<text x="110.0" y="168.0" class="ms" text-anchor="middle">SHA256SUMS</text>
<text x="110.0" y="185.0" class="s" text-anchor="middle">three _gsi- files</text>
<rect x="270" y="90" width="260" height="130" rx="8" fill="#132a3a" stroke="#38bdf8" stroke-width="1.5"/>
<text x="400" y="113" class="b" text-anchor="middle">The browser</text>
<rect x="283" y="125" width="234" height="38" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="400.0" y="148.5" class="s" text-anchor="middle">origin private file system</text>
<rect x="283" y="170" width="234" height="38" rx="8" fill="#172033" stroke="#3b4a63" stroke-width="1.5"/>
<text x="400.0" y="193.5" class="s" text-anchor="middle">a SHA-256 per file, as it arrives</text>
<path d="M195,155 L268,155" fill="none" stroke="#fbbf24" stroke-width="1.6" marker-end="url(#hfbbf24)"/>
<text x="231.5" y="132" class="s" text-anchor="middle">32 MiB</text>
<text x="231.5" y="147" class="s" text-anchor="middle">ranges</text>
<rect x="605" y="80" width="275" height="220" rx="8" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="742.5" y="103" class="b" text-anchor="middle">The phone, in fastboot</text>
<rect x="618" y="115" width="249" height="32" rx="5" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="628" y="135.5" class="m">vbmeta</text>
<text x="857" y="135.5" class="s" text-anchor="end">empty</text>
<rect x="618" y="151" width="249" height="32" rx="5" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="628" y="171.5" class="m">init_boot</text>
<text x="857" y="171.5" class="s" text-anchor="end">LosOS's ramdisk</text>
<rect x="618" y="187" width="249" height="32" rx="5" fill="#1d2a1c" stroke="#a3e635" stroke-width="1.5"/>
<text x="628" y="207.5" class="m">userdata</text>
<text x="857" y="207.5" class="s" text-anchor="end">sparse pieces</text>
<rect x="618" y="223" width="249" height="32" rx="5" fill="#172033" stroke="#3b4a63" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="628" y="243.5" class="m">vendor_boot</text>
<text x="857" y="243.5" class="s" text-anchor="end">untouched</text>
<rect x="618" y="259" width="249" height="32" rx="5" fill="#172033" stroke="#3b4a63" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="628" y="279.5" class="m">super, the rest</text>
<text x="857" y="279.5" class="s" text-anchor="end">untouched</text>
<path d="M530,155 L603,155" fill="none" stroke="#a3e635" stroke-width="1.6" marker-end="url(#ha3e635)"/>
<text x="566.5" y="147" class="s" text-anchor="middle">WebUSB</text>
<text x="25" y="248" class="s">On a phone without init_boot, the flasher reads the phone's boot</text>
<text x="25" y="264" class="s">image back or takes it from the factory image, checks the kernel</text>
<text x="25" y="280" class="s">is 5.10 or newer, appends LosOS's ramdisk, and writes boot.</text>
<text x="25" y="306" class="s">Each userdata piece is at most max-download-size.</text>
</svg>
