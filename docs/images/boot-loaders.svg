<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="900" height="310" role="img">
<title>How a PC starts LosOS, under UEFI and under a legacy BIOS</title>
<desc>UEFI firmware starts GRUB from the ESP, which chainloads the newest UKI. A legacy BIOS starts the same GRUB menu from the MBR and the BIOS boot partition, which starts the same UKI's kernel, initrd and command line from files beside it. Both reach the same systemd initrd, which mounts the /usr slot named by usrhash= with dm-verity.</desc>
